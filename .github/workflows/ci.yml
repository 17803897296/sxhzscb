name: ci

# 评审 P0 第二刀：克隆后一条命令可验证。
# 页面和 payload 必须成对提交——构建产物与提交不一致时 CI 直接红。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      # 关闭行尾转换：保证构建输出与提交的 LF blob 逐字节可比
      - name: git 行尾关闭 autocrlf
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装测试依赖
        run: pip install pytest
      - name: 单元回归
        run: pytest
      - name: 重建正本薄页（python -m ent_tools build）
        run: python -m ent_tools build
      # 原来只有一句 `git diff --exit-code`：红了只给一个退出码，得自己猜是
      # 源码没重建、还是手工改过 demo/、还是换行符被平台转成了 CRLF（2026-11-18
      # 就踩了这个：构建写 CRLF，这条断言从加进来起就不可能通过）。现在把
      # 不一致的文件逐个打出来，并附带 diff 摘要。
      - name: 构建产物必须与提交一致
        shell: pwsh
        run: |
          $d = git status --porcelain -- demo ent_tools/data/fair_payload.json
          if ($d) {
            Write-Host "::error::构建产物与提交不一致：改了源码/画像没重建，或手工改过 demo/"
            $d | ForEach-Object { Write-Host "  不一致：$_" }
            git --no-pager diff --stat -- demo ent_tools/data/fair_payload.json
            Write-Host "修复：python -m ent_tools build 后把 demo/ 一起提交"
            exit 1
          }
          Write-Host "构建产物与提交一致。"
