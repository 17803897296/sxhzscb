<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>企业端 · 岗位上传</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #202b42;
      background: #f8faff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, textarea { font: inherit; }
    .app {
      width: min(820px, calc(100% - 32px));
      min-height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      height: 76px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex: none;
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: #4268ee;
      color: white;
      font-size: 18px;
      font-weight: 700;
    }
    .topbar strong { font-size: 17px; letter-spacing: .01em; }
    .conversation {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 18px 2px 30px;
    }
    .message {
      max-width: min(680px, 92%);
      padding: 13px 17px;
      border-radius: 18px;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 15px;
    }
    .message.user {
      align-self: flex-end;
      background: #e9efff;
      border-bottom-right-radius: 6px;
    }
    .message.assistant {
      align-self: flex-start;
      background: #fff;
      border: 1px solid #e7ebf3;
      border-bottom-left-radius: 6px;
      box-shadow: 0 3px 14px rgba(37, 56, 101, .04);
    }
    .message.error { color: #b42318; }
    .dock {
      position: sticky;
      bottom: 0;
      flex: none;
      padding: 14px 0 20px;
      background: linear-gradient(transparent, #f8faff 24%);
    }
    .composer {
      background: #fff;
      border: 1px solid #dbe2f0;
      border-radius: 25px;
      box-shadow: 0 12px 38px rgba(30, 48, 97, .09);
      transition: border-color .15s, box-shadow .15s;
    }
    .composer:focus-within {
      border-color: #5d7dfa;
      box-shadow: 0 12px 38px rgba(30, 48, 97, .09), 0 0 0 3px rgba(93, 125, 250, .12);
    }
    .editor { position: relative; }
    .url-icon {
      display: none;
      position: absolute;
      z-index: 2;
      top: 22px;
      left: 20px;
      width: 21px;
      height: 21px;
      color: #2759d9;
      pointer-events: none;
    }
    .url-icon svg { display: block; width: 100%; height: 100%; }
    .composer.has-leading-url .url-icon { display: block; }
    .composer.has-leading-url .highlight,
    .composer.has-leading-url textarea { padding-left: 55px; }
    .highlight, textarea {
      display: block;
      width: 100%;
      height: 112px;
      min-height: 112px;
      max-height: 260px;
      margin: 0;
      padding: 19px 21px 8px;
      border: 0;
      border-radius: 25px 25px 0 0;
      font-size: 16px;
      line-height: 1.65;
      font-weight: 400;
      letter-spacing: normal;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      tab-size: 4;
    }
    .highlight {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      color: #202b42;
    }
    .highlight .url { color: #2759d9; }
    textarea {
      position: relative;
      z-index: 1;
      resize: none;
      outline: none;
      overflow-y: auto;
      background: transparent;
      color: #202b42;
      caret-color: #202b42;
      scrollbar-width: none;
    }
    textarea::-webkit-scrollbar { display: none; }
    body.highlight-ready textarea { color: transparent; }
    textarea::placeholder { color: #9ba8c0; opacity: 1; }
    textarea::selection { background: rgba(72, 107, 241, .23); }
    .attachments[hidden] { display: none; }
    .attachments {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 1px 18px 10px;
    }
    .attachment {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      max-width: 100%;
      padding: 7px 9px 7px 11px;
      border: 1px solid #dfe6f5;
      border-radius: 10px;
      background: #f4f7fd;
      color: #40516f;
      font-size: 13px;
    }
    .attachment span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .attachment button {
      border: 0;
      padding: 0 2px;
      background: none;
      color: #7887a2;
      font-size: 17px;
      cursor: pointer;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 13px 12px;
    }
    .add-button, .send-button {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      transition: background .15s, transform .15s;
    }
    .add-button {
      background: #f0f3fa;
      color: #42516b;
      font-size: 26px;
      line-height: 1;
    }
    .send-button {
      background: #3f65ea;
      color: white;
    }
    .add-button:hover, .send-button:hover:not(:disabled) { transform: translateY(-1px); }
    .add-button:hover { background: #e6ebf6; }
    .send-button:hover:not(:disabled) { background: #2e54da; }
    .send-button:disabled { background: #ccd5eb; cursor: default; }
    .send-button svg { width: 19px; height: 19px; }
    button:focus-visible { outline: 3px solid #aabaff; outline-offset: 2px; }
    .hint { margin-left: 10px; color: #98a3b6; font-size: 12px; }
    .footnote { margin: 10px 0 0; text-align: center; color: #9aa5ba; font-size: 12px; }
    @media (max-width: 600px) {
      .topbar { height: 62px; }
      .hint { display: none; }
      .dock { padding-bottom: 10px; }
      .footnote { font-size: 11px; }
    }
  </style>
</head>
<body>
    <main class="app">
    <header class="topbar">
        <div class="brand-mark" aria-hidden="true">企</div>
        <strong>企业端 · 岗位上传</strong>
    </header>

    <section id="conversation" class="conversation" role="log" aria-live="polite"></section>

    <div class="dock">
        <form id="form" class="composer">
        <div class="editor">
          <span class="url-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9M12 3c-2.5 2.5-3.8 5.5-3.8 9s1.3 6.5 3.8 9"></path>
            </svg>
          </span>
            <div id="highlight" class="highlight" aria-hidden="true"></div>
            <textarea
            id="text"
            aria-label="输入招聘岗位信息或网页链接"
            placeholder="粘贴贵单位的招聘岗位信息：岗位名称、职责要求，或招聘页链接"
            rows="3"
            ></textarea>
        </div>

        <div id="attachments" class="attachments" hidden></div>

        <div class="controls">
            <div>
            <button
                id="add"
                class="add-button"
                type="button"
                aria-label="添加岗位文件"
                title="添加岗位文件（PDF / Word / Excel / CSV / 图片）"
            >+</button>
            </div>
            <button
            id="send"
            class="send-button"
            type="submit"
            aria-label="提交岗位"
            title="提交岗位"
            disabled
            >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2.4" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <path d="M12 19V5M6 11l6-6 6 6"/>
            </svg>
            </button>
        </div>
        </form>

        <input
        id="files"
        type="file"
        multiple
        hidden
        accept=".pdf,.doc,.docx,.xlsx,.xls,.csv,.txt,.png,.jpg,.jpeg,.webp"
        >
    </div>

    <p class="footnote">提交后的岗位由组委会统一核录入库，库内清单不在本页展示。</p>
    </main>

  <script>
    const form = document.querySelector("#form");
    const textarea = document.querySelector("#text");
    const highlight = document.querySelector("#highlight");
    const attachments = document.querySelector("#attachments");
    const filesInput = document.querySelector("#files");
    const addButton = document.querySelector("#add");
    const sendButton = document.querySelector("#send");
    const conversation = document.querySelector("#conversation");
    const selectedFiles = [];
    let sending = false;

    function escapeHtml(value) {
      return value.replace(/[&<>"]/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"
      })[character]);
    }

    function findUrls(value) {
      const matches = [];
      for (const match of value.matchAll(/https?:\/\/[^\s<>"']+/gi)) {
        const url = match[0].replace(/[),.;!?，。；！？）]+$/g, "");
        try {
          if (new URL(url).hostname) {
            matches.push({ start: match.index, end: match.index + url.length, value: url });
          }
        } catch {
          // A URL being typed is not complete yet.
        }
      }
      return matches;
    }

    function updateInput() {
      textarea.style.height = "112px";
      const height = Math.min(Math.max(textarea.scrollHeight, 112), 260);
      textarea.style.height = height + "px";
      highlight.style.height = height + "px";

      const value = textarea.value;
      const urls = findUrls(value);
      form.classList.toggle("has-leading-url", urls.some(url => url.start === 0));
      let html = "";
      let cursor = 0;
      for (const url of urls) {
        html += escapeHtml(value.slice(cursor, url.start));
        html += '<span class="url">' + escapeHtml(url.value) + "</span>";
        cursor = url.end;
      }
      highlight.innerHTML = html + escapeHtml(value.slice(cursor)) + "\u200b";
      highlight.scrollTop = textarea.scrollTop;
      highlight.scrollLeft = textarea.scrollLeft;

      sendButton.disabled = sending || (!value.trim() && selectedFiles.length === 0);
    }

    function renderFiles() {
      attachments.replaceChildren();
      attachments.hidden = selectedFiles.length === 0;
      selectedFiles.forEach((file, index) => {
        const chip = document.createElement("div");
        chip.className = "attachment";
        const label = document.createElement("span");
        label.textContent = file.name;
        const remove = document.createElement("button");
        remove.type = "button";
        remove.setAttribute("aria-label", "移除 " + file.name);
        remove.textContent = "×";
        remove.addEventListener("click", () => {
          selectedFiles.splice(index, 1);
          renderFiles();
          updateInput();
        });
        chip.append(label, remove);
        attachments.appendChild(chip);
      });
      updateInput();
    }

    function addMessage(kind, value) {
      const message = document.createElement("div");
      message.className = "message " + kind;
      message.textContent = value;
      conversation.appendChild(message);
      conversation.scrollTop = conversation.scrollHeight;
      return message;
    }

    /* 离线演示兜底：后端不可用时按行数本地记账，不碰库 */
    function localCount(text) {
      return String(text || "")
        .split(/[\n\r]+/)
        .map(s => s.trim())
        .filter(s => s.length >= 2 && s.length <= 80).length;
    }

    textarea.addEventListener("input", updateInput);
    textarea.addEventListener("scroll", () => {
      highlight.scrollTop = textarea.scrollTop;
      highlight.scrollLeft = textarea.scrollLeft;
    });
    textarea.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        form.requestSubmit();
      }
    });
    addButton.addEventListener("click", () => filesInput.click());
    filesInput.addEventListener("change", () => {
      selectedFiles.push(...filesInput.files);
      filesInput.value = "";
      renderFiles();
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (sending) return;

      const input = textarea.value.trim();
      const urls = findUrls(input);
      if (urls.length > 1) {
        addMessage("assistant error", "一次请发送一个网页链接。");
        return;
      }

      const url = urls[0]?.value || "";
      const text = url
        ? (input.slice(0, urls[0].start) + input.slice(urls[0].end)).trim()
        : input;
      if (!text && !url && selectedFiles.length === 0) return;

      const filesToSend = [...selectedFiles];
      const summary = [input, filesToSend.length
        ? "附件：" + filesToSend.map(file => file.name).join("、")
        : ""].filter(Boolean).join("\n");
      addMessage("user", summary.length > 450 ? summary.slice(0, 450) + "…" : summary);
      const reply = addMessage("assistant", "正在提交岗位…");

      const data = new FormData();
      data.append("text", text);
      data.append("url", url);
      filesToSend.forEach(file => data.append("files", file));
      sending = true;
      updateInput();

      try {
        let count;
        if (location.protocol === "file:") {
          await new Promise(r => setTimeout(r, 600));
          count = localCount(text) + filesToSend.length;
        } else {
          const response = await fetch("/api/jobs-upload", { method: "POST", body: data });
          if (!response.ok) {
            const error = await response.json().catch(() => ({}));
            throw new Error(typeof error.detail === "string" ? error.detail : "提交失败，请重试。");
          }
          const out = await response.json();
          count = out.count;
        }

        const parts = [];
        if (count > 0) parts.push("共 " + count + " 条岗位记录");
        if (filesToSend.length) parts.push(filesToSend.length + " 个附件");
        reply.textContent = "提交完成，" + (parts.length ? parts.join("，") : "内容") +
          "已收到。组委会核录后统一入库，结果不在本页展示。";
        textarea.value = "";
        selectedFiles.length = 0;
        renderFiles();
      } catch (error) {
        reply.classList.add("error");
        reply.textContent = error.message || "提交失败，请重试。";
      } finally {
        sending = false;
        updateInput();
        conversation.scrollTop = conversation.scrollHeight;
      }
    });

    if (location.protocol === "file:") {
      addMessage("assistant", "当前是离线演示模式：提交只做本地记账，不连接后端。从 http://127.0.0.1:8102/ 打开才能真正提交。");
    }
    addMessage("assistant",
      "这里是岗位上传入口：把贵单位本次双选会要招的岗位粘贴进来（岗位名称、职责要求），或发招聘页链接，也可以点 + 上传岗位说明文件（PDF / Word / Excel / CSV / 图片）。\n库内已有清单不在本页展示，提交后由组委会统一核录。");
    updateInput();
    document.body.classList.add("highlight-ready");
  </script>
</body>
</html>
