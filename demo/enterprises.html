<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>企业端 · 参会企业名单导入</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #202b42;
      background: #f8faff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input, textarea { font: inherit; }
    .app {
      width: min(820px, calc(100% - 32px));
      min-height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding-bottom: 28px;
    }
    .topbar {
      height: 76px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex: none;
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: #4268ee;
      color: white;
      font-size: 18px;
      font-weight: 700;
    }
    .topbar strong { font-size: 15px; letter-spacing: .01em; }
    .page-hint {
      margin: 0 0 18px;
      color: #5b6b88;
      font-size: 13px;
      line-height: 1.7;
    }
    #chat { flex: 1 1 auto; }
    .footnote { margin: 18px 0 0; text-align: center; color: #9aa5ba; font-size: 12px; }
    .offline-note {
      margin: 6px 0 0;
      padding: 14px 16px;
      border: 1px solid #dde5f5;
      border-radius: 12px;
      background: #fff;
      color: #5b6b88;
      font-size: 13px;
      line-height: 1.7;
    }
    @media (max-width: 600px) {
      .topbar { height: 62px; }
      .page-hint { font-size: 12px; }
      .footnote { font-size: 11px; }
    }
  </style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand-mark" aria-hidden="true">企</div>
    <strong>企业端 · 参会企业名单导入</strong>
  </header>

  <p class="page-hint">
    把参会企业名单交上来：上传名单文件、贴一个网址，或直接粘贴，一行一家。
    搜索会按名单逐家补齐企业档案与岗位。
  </p>

  <!-- 名单导入块挂在这里（rosterOnly 模式）。企业岗位信息统一由采集端
       从公开来源获取，这一页不再接受企业自助粘贴岗位。 -->
  <section id="chat"></section>

  <p class="footnote">名单只用于补齐这家企业的档案与岗位；库内清单不在本页展示。</p>
</main>

<script>
  /* 名单导入块（v12 三端分工）：源码来自 /js/match.js（服务端替换占位符），
     rosterOnly 模式只挂「导入参会企业名单」，不渲染开始匹配与结果区——
     匹配排行归匹配端。file:// 离线双击没有本地服务，退成一句说明。 */
  (async () => {
    if (location.protocol === "file:") {
      const note = document.createElement("p");
      note.className = "offline-note";
      note.textContent = "当前是离线双击模式，名单导入需要本地服务："
        + "双击「启动离线版.bat」后从 http://127.0.0.1:8103/enterprises.html 打开。";
      document.querySelector("#chat").appendChild(note);
      return;
    }
    try {
      const src2 = await (await fetch("/js/match.js")).text();
      const host = document.createElement("div");
      host.innerHTML = src2;
      host.querySelectorAll("script").forEach(old => {
        const s = document.createElement("script");
        s.textContent = old.textContent;
        document.body.appendChild(s);
      });
      if (window.__mountMatch) window.__mountMatch(null, { rosterOnly: true });
    } catch (e) {
      const note = document.createElement("p");
      note.className = "offline-note";
      note.textContent = "名单导入块没加载出来（服务不可达）。请确认服务在跑，再刷新本页。";
      document.querySelector("#chat").appendChild(note);
    }
  })();
</script>
</body>
</html>
