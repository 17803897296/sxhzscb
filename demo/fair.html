    apply(res) {
      if (!res || res.skipped) return;
      state.answers.values = res.values;
      state.answers.fair.target_company_types = [];
      state.answers.fair.home_city = res.home_city || '';
    },
    reset() {
      state.answers.values = { salary: 0, stability: 0, growth: 0, autonomy: 0, impact: 0, balance: 0 };
      state.answers.fair.target_company_types = [];
      state.answers.fair.home_city = '';
    },
  };
}

function consentCardStep() {
  return {
    id: 'consent',
    kind: 'card',
    ask: '信息够了。最后确认两件事，我就把画像整理出来。',
    async render() {
      const html = `<div class="chat-card">
        <div class="cc-title">生成前确认</div>
        <label class="check"><input type="checkbox" id="c-save" checked>
          <span>把这份画像保存到本机数据库（<span class="mono">fair_profiles</span>），供后段匹配取用；取消则只在你浏览器里生成。</span></label>
        <label class="check"><input type="checkbox" id="c-ack">
          <span>我知道：简历里提到的技能只按「自述」算，只有标了实践 + 作品引用才算有材料；本次不施测兴趣问卷。</span></label>
        <div class="cc-actions"><button type="button" class="btn btn-p" data-act="gen">生成画像 JSON</button></div>
      </div>`;
      const el = appendMsg('bot', html, 'wide');
      const root = el.querySelector('.bubble');
      state.awaiting = { step: null, botEls: [el], resolve: () => {} };
      state.awaitingEls = (state.awaitingEls || []).concat([el]);
      return new Promise(resolve => {
        root.querySelector('[data-act="gen"]').onclick = () => {
          if (!root.querySelector('#c-ack').checked) {
            const label = root.querySelector('#c-ack').closest('.check');
            label.classList.add('shake');
            setTimeout(() => label.classList.remove('shake'), 500);
            return;
          }
          const save = root.querySelector('#c-save').checked;
          state.awaiting = null;
          el.classList.add('resolved');
          root.querySelectorAll('button,input').forEach(x => { try { x.disabled = true; } catch (e) {} });
          resolve({ save });
        };
      });
    },
    summary() { return '确认生成'; },
    apply(res) { state.save = res.save !== false; },
    reset() {},
  };
}

/* ---------------- 流程 ---------------- */

function hardFilterStep() {
  return fairStep('hard_filter', '有没有硬性要求？只写一句就行，比如「只要南京的工作」「只看互联网」。没有就输入「没有」。', {
    allowCustom: true,
    optional: true,
    placeholder: '例如：只要南京 / 只看互联网 / 不要外企',
    hint: '这句会被当成硬条件：不满足的企业直接从名单里删掉，不是降权。空着或输入「没有」= 不设限。',
    after(value, a) {
      const v = String(value || '').trim();
      a.hard_filter = /^(没有|无|不设限|暂无|随便|都行)$/.test(v) ? '' : v;
    },
    reset(a) { a.hard_filter = ''; },
  });
}
function noMajorAcceptStep() {
  return fairStep('no_major_accept', '教培机构这类「不要求专业对口」的企业，你愿意考虑吗？', {
    options: ['愿意考虑', '不考虑'],
    alias: { 愿意: '愿意考虑', 可以: '愿意考虑', 接受: '愿意考虑', 考虑: '愿意考虑',
             不: '不考虑', 不要: '不考虑', 拒绝: '不考虑', 不接受: '不考虑' },
    hint: '教培、销售等岗位大多不限专业。选「不考虑」时，这类企业会从名单中剔除，避免它们占据靠前位置。',
    after(value, a) { a.accept_no_major = (value === '愿意考虑'); },
    reset(a) { a.accept_no_major = false; },
  });
}

function fairSteps() {
  return [
    fairStep('internship', '做过哪些实习 / 竞赛 / 论文？写岗位、项目或方向就行，也可以留空。', {
      allowCustom: true,
      optional: true,
      placeholder: '比如：供应链实习 / 美赛 Finalist / 本科论文《…》，做过几个写几个',
      hint: '自由填写，原样记录；这段会直接喂给后面的岗位推荐模型。不套任何岗位族，想跳过就输入「跳过」。',
      after(value, a) { a.direction_interest = value; },
      reset(a) { a.direction_interest = ''; },
    }),
  ];
}

function buildFlow() {
  const flow = [];
  /* 身份信息：三项分开填、都可空。简历已经抽到专业的就不再问；
     抽不到专业时补问一次（学校 / 年级即使已有也照常回填，可改可空）。 */
  /* 身份信息：三项分开填，专业必填、学校年级可空。简历已经抽到专业的就不再问；
     抽不到专业时补问一次（学校 / 年级即使已有也照常回填，可改可空）。 */
  const _idNow = state.answers.identity || {};
  if (!state.resume) {
    flow.push(identityFieldsStep());
  } else if (!String(_idNow.major || '').trim()) {
    flow.push(identityFieldsStep({
      ask: '简历里没抽到专业，麻烦补一下（必填）；学校和年级可以不填。',
    }));
  }
  
  /* v15：简历已抽到经历时跳过「实习/竞赛/论文」追问，直接用简历里的。 */
  const _resumeExpN = (function(){ const r = state.resume || {};
    return ((r.experiences || []).length + (r.competitions || []).length
      + (r.papers || []).length) || (((r.extraction || {}).experiences) || []).length;
  })();
  fairSteps().forEach(step => { if (step.id === 'internship' && _resumeExpN > 0) return; flow.push(step); });
  /* v13：先问完经历和教培接受度，再让大模型据此推荐岗位 */
  flow.push(noMajorAcceptStep());
  flow.push(jobRecommendStep());
  flow.push(preferencesCardStep());
  /* v11：只追问用户选中的关注点；guard 在运行时读取偏好卡结果 */
  const _prefPicked = k => (((state.answers.values || {})[k] || 0) > 0);
  const _rankIfPicked = (s, k) => Object.assign(s, { guard: () => _prefPicked(k) });
  flow.push(_rankIfPicked(cityRankStep(), 'city'));
  flow.push(_rankIfPicked(companyTypeRankStep(), 'company_type'));
  flow.push(_rankIfPicked(industryRankStep(), 'industry'));
  /* v12：硬约束（自由填空）排在排序追问之后；教培接受度已提前到岗位推荐之前 */
  flow.push(hardFilterStep());
  flow.push(consentCardStep());
  return flow;
}

function updateProgress() {
  const total = state.flow.length;
  const done = Math.min(Math.max(state.stepIdx, 0), total);
  $('progress').textContent = total ? `已答 ${done} / ${total} 题` : '';
  $('btn-back').disabled = state.history.length === 0 || state.generated;
}

async function runFlow(from) {
  const runId = ++state.runId;
  for (let i = from; i < state.flow.length; i++) {
    if (runId !== state.runId) return;
    state.stepIdx = i;
    updateProgress();
    const step = state.flow[i];
    if (step.guard && !step.guard()) continue;  // v11：按所选关注点动态跳过
    try {
      const botEl = await say(step.ask);
      if (runId !== state.runId) return;
      const botEls = [botEl];
      state.awaitingEls = botEls.slice();

      let res;
      if (step.kind === 'card') {
        res = await step.render();
        if (runId !== state.runId) return;
        state.awaitingEls.filter(el => el !== botEl).forEach(el => botEls.push(el));
      } else {
        res = await waitAnswer(step, botEls);
        if (runId !== state.runId) return;
      }

      const summary = step.summary ? step.summary(res) : (res.label || res.value || '');
      const userEl = appendMsg('user', esc(summary));
      step.apply(res);
      state.history.push({ idx: i, els: [...botEls, userEl], step });
      updateProgress();
      await sleep(100);
    } catch (e) {
      console.error(e);
      await say(note('bad', '这一步出了点问题，点「上一步」重试，或「重新开始」。'), { fast: true });
      return;
    }
  }
  if (runId !== state.runId) return;
  generateProfile();
}

/* ---------------- 上一步 / 重新开始 ---------------- */

function goBack() {
  if (state.generated || !state.history.length) return;
  const last = state.history.pop();
  const currentEls = state.awaitingEls.slice();
  state.runId++;
  state.awaiting = null;
  state.awaitingEls = [];
  disableComposer();
  $('composer').classList.remove('done');
  [...currentEls, ...last.els].forEach(el => el && el.remove());
  if (last.step.reset) last.step.reset();
  updateProgress();
  runFlow(last.idx);
}

/* ---------------- 生成与结果 ---------------- */

async function generateProfile() {
  syncAnswers();
  state.answers.fair.event_date = todayISO();
  applyResumeSkills();
  const typing = appendMsg('bot', '<div class="bubble typing"><i></i><i></i><i></i></div>');
  await sleep(320);
  typing.remove();
  $('progress').textContent = '正在整理…';
  let r;
  try {
    r = await api('/api/fair/profile', {
      method: 'POST',
      body: JSON.stringify({
        user_id: 'fair',
        answers: state.answers,
        resume: state.resume || {},
        consent: { store_locally: state.save, send_resume_to_model: !!(state.resume && state.resumeLLM) },
        save: state.save,
      }),
    });
  } catch (e) {
    await say(note('bad', '生成失败：网络或服务异常。'), { fast: true });
    return;
  }
  if (!r.ok) { await say(note('bad', esc(r.error || '生成失败')), { fast: true }); return; }
  state.generated = true;
  $('composer').classList.add('done');
  state.lastDoc = r.document;
  state.lastSaved = !!r.saved;
  $('progress').textContent = '已完成';
  $('btn-back').disabled = true;
  disableComposer();
  $('hint').textContent = '画像已生成，可以下载 JSON 交给后段匹配。';
  const el = appendMsg('bot', resultHTML(r.document, r.saved), 'wide');
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function resultHTML(doc, saved) {
  const q = doc.quality || {};
  const traits = (doc.summary && doc.summary.traits) || [];
  const fair = doc.fair || {};
  const identity = doc.identity || {};
  const exps = ((doc.resume || {}).extraction || {}).experiences || [];
  const skills = (doc.profile && doc.profile.skills) || [];
  const flagship = fair.flagship_experience || '';
  const missing = (q.missing || []).map(m => `<li>${esc(m.why)}</li>`).join('');
  const warnings = (q.warnings || []).map(w => `<li>${esc(w)}</li>`).join('');
  const honesty = (((doc.profile_card || {}).honesty_summary) || []).map(esc).join('<br>');

  const vMap = (doc.answers && doc.answers.values) || {};
  const vSum = Object.values(vMap).reduce((a, b) => a + b, 0);
  const vLabels = Object.fromEntries((Q.value_dimensions || []).map(([k, l]) => [k, l]));
  const prefText = vSum > 0
    ? Object.entries(vMap).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1])
        .map(([k, v]) => `${vLabels[k] || k} ${v}`).join(' · ')
    : '';
  const empText = ((fair.target_company_types) || []).join('、');
  const prefRows = (prefText ? `<div class="kv"><span class="k">偏好权重</span><span class="v">${esc(prefText)}（自述，合计 100）</span></div>` : '')
    + (empText ? `<div class="kv"><span class="k">企业类型</span><span class="v">${esc(empText)}（软偏好）</span></div>` : '')
    + (fair.home_city ? `<div class="kv"><span class="k">家乡城市</span><span class="v">${esc(fair.home_city)}（离家近参考）</span></div>` : '');
  const expList = exps.length
    ? exps.map(x => `<li class="${flagship && x.text === flagship ? 'flag' : ''}">${esc(x.text)}${flagship && x.text === flagship ? ' <span class="tag ok tiny">主经历</span>' : ''}</li>`).join('')
    : '<li class="muted">没有从简历里读到项目/实习经历。</li>';
  const skillChips = skills.length
    ? skills.map(x => `<span class="tag ${x.evidence_state === 'artifact_provided' ? 'ok' : 'warn'}" title="${esc(x.evidence_text || '')}">${esc(x.name)}</span>`).join('')
    : '<span class="muted">无</span>';

  return `<div class="result-card">
    <div class="rc-head">
      <div class="eyebrow">fair_profile · 双选会最小画像</div>
      <h2>${esc((doc.summary && doc.summary.headline) || '画像')}</h2>
      <p class="muted small"><span class="mono">${esc(doc.fair_id)}</span> · ${esc(doc.generated_at)}
        · v${esc(doc.document_version)} · ${saved ? '<span class="tag ok">已存入本机</span>' : '<span class="tag unk">仅浏览器内</span>'}</p>
      <div class="prog"><div class="bar"><i style="width:${q.score || 0}%"></i></div>
        <span><b>${q.score || 0}</b>/100 · ${esc(q.level || '')}</span></div>
    </div>
    <div class="rc-body">
      <div class="sec-t">这份画像的特点</div>
      <ul class="traitlist">${traits.map(t => `<li>${esc(t)}</li>`).join('')}</ul>

      <div class="sec-t">身份</div>
      <div class="kv"><span class="k">姓名</span><span class="v">${esc(identity.name || '—')}</span></div>
      <div class="kv"><span class="k">学校 / 专业</span><span class="v">${esc([identity.school, identity.major].filter(Boolean).join(' · ') || '—')}</span></div>
      <div class="kv"><span class="k">学历 / 年级</span><span class="v">${esc([identity.degree, identity.grade].filter(Boolean).join(' · ') || '—')}</span></div>
      <div class="kv"><span class="k">联系方式</span><span class="v">${esc([identity.phone, identity.email].filter(Boolean).join(' · ') || '—')}</span></div>

      <div class="sec-t">求职意向（4 个必答）</div>
      <div class="kv"><span class="k">阶段</span><span class="v">${esc([fair.stage_detail, fair.target_stage].filter(Boolean).join(' · ') || '—')}</span></div>
      <div class="kv"><span class="k">方向</span><span class="v">${esc(doc.answers.direction_interest || '—')}</span></div>
      <div class="kv"><span class="k">城市</span><span class="v">${esc(doc.answers.region || '—')}</span></div>
      <div class="kv"><span class="k">时间窗</span><span class="v">${esc(doc.answers.timeline || '—')}</span></div>
      <div class="kv"><span class="k">场次</span><span class="v">${esc(fair.event_date || '—')}</span></div>
      ${prefRows}

      <div class="sec-t">能力关键词（简历/自述，未核实）</div>
      <div class="chips">${skillChips}</div>

      <div class="sec-t">项目 / 实习经历</div>
      <ul class="explist">${expList}</ul>

      <div class="sec-t">兴趣 / 价值观</div>
      <div class="note"><span class="ic">i</span><div>${vSum > 0
        ? 'RIASEC 未施测，兴趣记为「未测量」；价值观按偏好权重收集（合计 100，自述，仅用于排序）。'
        : '本次未施测 RIASEC，兴趣记为「未测量」；价值观本次不收集，记为「未收集」。都不是低分。'}</div></div>

      ${missing ? `<div class="sec-t">还缺什么（影响后段匹配）</div><ul class="misslist">${missing}</ul>` : ''}
      ${warnings ? `<div class="sec-t">需要注意</div><div class="note warn"><span class="ic">⚠</span><div><ul class="misslist">${warnings}</ul></div></div>` : ''}
      <div class="sec-t">诚实性摘要</div>
      <div class="note ok"><span class="ic">✓</span><div>${honesty || '信息来自本人陈述与简历抽取；未做任何能力核实。'}</div></div>

      <div class="json-actions">
        <button type="button" class="btn btn-p" onclick="downloadJson()">下载 JSON</button>
        <button type="button" class="btn btn-g" onclick="copyJson()">复制 JSON</button>
        <button type="button" class="btn btn-g" onclick="location.reload()">再采一份</button>
        <span class="muted small" id="copy-msg"></span>
      </div>
      <details style="margin-top:14px"><summary>机器可读 · 完整 JSON（doc v${esc(doc.document_version)}）</summary>
        <pre class="out" id="json-out">${esc(JSON.stringify(doc, null, 2))}</pre></details>
    </div>
  </div>`;
}

function downloadJson() {
  if (!state.lastDoc) return;
  const blob = new Blob([JSON.stringify(state.lastDoc, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${state.lastDoc.fair_id || 'fair-profile'}.fair-profile.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function copyJson() {
  if (!state.lastDoc) return;
  try {
    await navigator.clipboard.writeText(JSON.stringify(state.lastDoc, null, 2));
    const m = $('copy-msg'); if (m) m.textContent = '已复制到剪贴板';
  } catch (e) {
    const m = $('copy-msg'); if (m) m.textContent = '复制失败，请从下面的 JSON 手动选择';
  }
}

/* ---------------- 启动 ---------------- */

async function init() {
  /* v11.1 报告模式：新标签打开 ?detail= 时，本标签没有采集记录，
     原逻辑会把用户当新访客从头问一遍 —— 这里直接渲染报告。 */
  const _modeQ = new URLSearchParams(location.search);
  if (_modeQ.get('detail') || _modeQ.get('report') || window.__FORCE_REPORT) {
    document.body.classList.add('report-only');
    const _st = document.getElementById('status-t');
    if (_st) _st.textContent = '双选会匹配报告';
    document.title = (_modeQ.get('detail') ? _modeQ.get('detail') + ' · ' : '') + '双选会匹配报告';
    let _mounted = false, _refreshed = false, _tries = 0;
    const _go = function(){
      try {
        if (!_mounted && window.__mountMatch) {
          window.__mountMatch({});
          _mounted = true;
        }
        if (_mounted && !_refreshed && window.__triRefresh) {
          window.__triRefresh();
          _refreshed = true;
        }
      } catch (e) {}
    };
    _go();
    const _tk = setInterval(function(){
      _tries++; _go();
      if ((_mounted && _refreshed) || _tries > 60) clearInterval(_tk);
    }, 100);
    return;
  }
  try {
    Q = await api('/api/fair/questionnaire');
  } catch (e) {
    $('status-t').textContent = '后端未连接';
    return;
  }
  if (!Q || !Q.ok) {
    $('status-t').textContent = '问卷加载失败';
    $('status').querySelector('.dot').className = 'dot bad';
    return;
  }
  $('status-t').textContent = Q.fair.llm_configured ? '模型可用（可增强抽取）' : '仅本地规则抽取';
  $('status').querySelector('.dot').className = 'dot ' + (Q.fair.llm_configured ? 'ok' : 'warn');
  $('ver').textContent = 'fair_doc ' + Q.fair.doc_version + ' · schema ' + Q.schema_version;

  $('send').onclick = sendTyped;
  $('msg').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); sendTyped(); } });
  $('btn-back').onclick = goBack;
  $('btn-restart').onclick = () => location.reload();

  state.answers = blankAnswers();
  disableComposer();

  await say('你好，我是 CareerSafari。带上简历的话，我只再问你 4 个问题，就能生成一份双选会画像。');
  const choice = await startCard();
  if (choice === 'uploaded') {
    await say(`简历解析完了（${state.resume.method === 'rules+llm' ? '规则 + 模型' : '本地规则'}）。`, { fast: true });
    const action = await resumeSummaryCard();
    if (action === 'edit') await identityEditCard();
    const exps = state.resume.experiences || [];
    /* v15：不再弹「哪段经历最想让我们看」。多段自动取第一段，消息里说明清楚。 */
    if (exps.length) {
      state.answers.fair.flagship_experience = exps[0].text;
      await say('经历直接用简历里的（共 ' + exps.length
        + ' 段，匹配优先看第 1 段），不再重复问你。', { fast: true });
    }
  } else {
    await say('没问题，那我们只聊 4 个问题；学校、专业、年级分开填，专业必填，学校和年级可以不填。');
  }
  state.flow = buildFlow();
  updateProgress();
  runFlow(0);
}

init();

</script>

    let why = "岗位描述未命中关键词，按中性分 0.50";
    if (posHits.length) { s = 1.0; why = "命中「" + posHits.join("、") + "」→ 1.00"; }
    if (negHits.length) { s = 0.1; why = "命中反向词「" + negHits.join("、") + "」→ 0.10"; }
    out[dim] = s;
    notes[dim] = why;
  });
  return { scores: out, notes };
}

function baseOf(prof, c){
  const regions = Array.isArray(prof.region) ? prof.region
                : String(prof.region || "").split(/[、/，,\s]+/).filter(Boolean);
  const city = String(c.city || "未知");
  let cityPart = 0.6;
  let cityNote = "未填期望城市，按中性分 0.60";
  if (city === "未知") {
    cityNote = "企业城市未知，按中性分 0.60";
  } else if (regions.includes("不限")) {
    cityNote = "期望城市不限，按中性分 0.60";
  } else if (regions.length) {
    const hit = regions.find(r => r && (city.includes(r) || r.includes(city)));
    cityPart = hit ? 1.0 : 0;
    cityNote = hit ? "在期望城市「" + hit + "」→ 1.00" : "不在期望城市（企业城市：" + city + "）→ 0.00";
  }

  const words = String(prof.direction_interest || "").split(/[、/，,\s]+/).filter(w => w.length >= 2);
  const jobs = c.jobs || [];
  const blob = jobs.map(j => (j.title || "") + (j.requirements || "")).join(" ");
  let dirPart;
  let dirNote;
  let dirHits = [];
  if (!words.length) {
    dirPart = 0.5;
    dirNote = "未填期望方向，按中性分 0.50";
  } else if (!jobs.length) {
    dirPart = 0.3;
    dirNote = "没有岗位资料，方向只能按 0.30";
  } else {
    dirHits = words.filter(w => blob.includes(w));
    dirPart = clamp01(dirHits.length / words.length * 1.5);
    dirNote = dirHits.length
      ? "岗位命中方向词「" + dirHits.join("、") + "」→ " + dirPart.toFixed(2)
      : "岗位描述没有命中方向词「" + words.join("、") + "」→ 0.00";
  }

  const jobWithUrgency = jobs.find(j => ["高","中","低"].includes(j.urgency));
  const u = jobWithUrgency ? jobWithUrgency.urgency : "";
  const urgPart = { "高":1.0, "中":0.6, "低":0.2 }[u] ?? 0.4;
  const urgNote = u
    ? "岗位标注紧急度「" + u + "」→ " + urgPart.toFixed(2)
    : "岗位未标注紧急度，按 0.40";

  return {
    base: 40*cityPart + 35*dirPart + 25*urgPart,
    cityPart, dirPart, urgPart, cityNote, dirNote, urgNote, dirHits
  };
}

function profileFromDoc(doc){
  const a = (doc && doc.answers) || {};
  const f = (doc && doc.fair) || {};
  const id = (doc && doc.identity) || {};
  return {
    region: a.region || "", home_city: f.home_city || "",
    direction_interest: a.direction_interest || "",
    major_fit: a.major_fit || "不限专业，都看看",
    values: a.values || {}, target_company_types: f.target_company_types || [],
    stage_detail: f.stage_detail || "", major: id.major || ""
  };
}

const shortNote = s => String(s || "").replace(/\s*→\s*[\d.]+\s*$/, "").trim();

function match(companies, prof){
  const weightInfo = weightsOf(prof);
  const vals = weightInfo.vals;
  const types = Array.isArray(prof.target_company_types) ? prof.target_company_types : [];
  const home = String(prof.home_city || "未知");

  const scored = companies.map(c => {
    const baseInfo = baseOf(prof, c);
    const dimInfo = dimScores(c);
    const dims = dimInfo.scores;
    const dimNotes = dimInfo.notes;
    const preferencePoints = DIM_KEYS.reduce((n, k) => n + vals[k] * dims[k], 0);
    const factor = 1 + preferencePoints / 100;

    const reasons = [];
    if (baseInfo.cityPart >= 1) reasons.push("在期望城市");
    if (baseInfo.dirPart >= 1) reasons.push("方向对口");
    let bonus = 0;
    const bonusReasons = [];
    if (types.includes(c.nature)) {
      bonus += 5;
      bonusReasons.push("命中企业类型偏好 +5");
      reasons.push("命中企业类型偏好");
    }
    if (home !== "未知" && c.city === home) {
      bonus += 8;
      bonusReasons.push("就在家乡 +8");
      reasons.push("就在家乡");
    }
    const jobs = c.jobs || [];
    const hot = jobs.find(j => j.urgency === "高");
    if (hot) reasons.push(hot.title + " 急招");
    const top = jobs[0];

    // 命中 / 没中：把这家企业到底吃到了哪些分写清楚
    const hits = [];
    const misses = [];

    if (baseInfo.cityPart >= 1) {
      hits.push("城市（在期望城市「" + (c.city || "未知") + "」）");
    } else if (baseInfo.cityPart === 0) {
      misses.push("城市（不在期望城市，企业城市：" + (c.city || "未知") + "）");
    }

    const dirHits = baseInfo.dirHits || [];
    if (baseInfo.dirPart >= 1) {
      hits.push("方向（命中「" + dirHits.join("、") + "」）");
    } else if (baseInfo.dirPart > 0 && jobs.length) {
      hits.push("方向（部分命中 " + f2(baseInfo.dirPart) + "）");
    } else if (baseInfo.dirPart === 0) {
      misses.push("方向（未命中「" + String(prof.direction_interest || "") + "」）");
    }

    if (hot) {
      hits.push("急招（" + (hot.title || "岗位") + "）");
    } else if (baseInfo.urgPart >= 0.6) {
      hits.push("紧急度（中）");
    } else if (baseInfo.urgPart === 0.2) {
      misses.push("紧急度（低）");
    }

    DIM_KEYS.forEach(k => {
      const s = dims[k];
      if (s >= 0.6) {
        hits.push(DIM_LABEL[k] + "（" + shortNote(dimNotes[k]) + "）");
      } else if (s <= 0.1) {
        misses.push(DIM_LABEL[k] + "（" + shortNote(dimNotes[k]) + "）");
      }
    });

    if (types.includes(c.nature)) hits.push("企业类型（" + c.nature + " +5）");
    if (home !== "未知" && c.city === home) hits.push("家乡（" + home + " +8）");
    if (!jobs.length) misses.push("岗位（未查到，方向和紧急度只能按中性分）");

    const hitLine = hits.join(" · ") || "没有明显命中项，主要按中性分计算";
    const missLine = misses.join(" · ");
    const score = Math.round((baseInfo.base * factor + bonus) * 10) / 10;

    return {
      id: c.id, name: c.name, nature: c.nature, city: c.city,
      industry: c.industry || "未知", jobSource: c.jobSource || "未知",
      jobs: jobs,
      score: score,
      line: reasons.join(" · ") || (top ? top.title : "按综合条件"),
      hits: hits, misses: misses, hitLine: hitLine, missLine: missLine,
      gap: jobs.length ? "" : "未查到岗位，仅按企业与地域排序",
      calc: {
        base: baseInfo.base,
        cityPart: baseInfo.cityPart, dirPart: baseInfo.dirPart, urgPart: baseInfo.urgPart,
        cityNote: baseInfo.cityNote, dirNote: baseInfo.dirNote, urgNote: baseInfo.urgNote,
        dims: dims, dimNotes: dimNotes, weights: vals,
        preferencePoints: preferencePoints, factor: factor,
        bonus: bonus, bonusReasons: bonusReasons,
        uncollected: weightInfo.uncollected
      }
    };
  }).sort((a, b) => b.score - a.score);

  const withJobs = scored.filter(r => r.jobs && r.jobs.length);
  const noJobs = scored.filter(r => !(r.jobs && r.jobs.length));

  // 学生选「只看和专业对口的」→ 方向不成立的不进推荐榜，直接压到放弃
  const strict = String(prof.major_fit || "").indexOf("只看") === 0;
  const gated = strict ? withJobs.filter(r => r.calc.dirPart < 0.5) : [];
  const pool = strict ? withJobs.filter(r => r.calc.dirPart >= 0.5) : withJobs;

  pool.forEach((r, i) => {
    const n = pool.length;
    r.tier = i < Math.max(1, Math.round(n * 0.3)) ? "优先去"
           : i < Math.max(2, Math.round(n * 0.7)) ? "可以看" : "建议放弃";
  });
  gated.forEach(r => {
    r.tier = "建议放弃";
    r.line = "专业方向不对口 · " + r.line;
    r.misses.push("方向（你选了「只看专业对口的」，这家不进推荐榜）");
  });
  noJobs.forEach(r => { r.tier = "资料不全"; });

  return pool.concat(gated).concat(noJobs);
}

const esc2 = s => String(s == null ? "" : s).replace(/[&<>"]/g,
  c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

const TIER_META = [
  { key: "优先去",   cls: "t1", note: "先走这几家" },
  { key: "可以看",   cls: "t2", note: "有余力再去" },
  { key: "建议放弃", cls: "t3", note: "别把时间花在这" },
  { key: "资料不全", cls: "t4", note: "未查到岗位，先补数据" }
];

const f1 = n => Number(n || 0).toFixed(1);
const f2 = n => Number(n || 0).toFixed(2);

function companyInfoLine(r){
  const jobs = r.jobs || [];
  return [
    "城市：" + (r.city || "未知"),
    "性质：" + (r.nature || "未知"),
    "行业：" + (r.industry || "未知"),
    jobs.length ? "岗位：" + jobs.length + " 个" : "岗位：未查到",
    "来源：" + (r.jobSource || "未知")
  ].join(" · ");
}

function renderCalc(r){
  const c = r.calc;
  const baseLine = "城市 40×" + f2(c.cityPart) + "=" + f1(40 * c.cityPart)
    + " + 方向 35×" + f2(c.dirPart) + "=" + f1(35 * c.dirPart)
    + " + 紧急度 25×" + f2(c.urgPart) + "=" + f1(25 * c.urgPart)
    + " → 基础分 " + f1(c.base);
  const prefParts = DIM_KEYS.map(k =>
    DIM_LABEL[k] + " " + c.weights[k] + "×" + f2(c.dims[k]) + "=" + f1(c.weights[k] * c.dims[k])
  );
  const prefLine = "偏好：" + prefParts.join(" + ")
    + " = " + f1(c.preferencePoints)
    + " → 系数 1 + " + f1(c.preferencePoints) + "/100 = " + f2(c.factor);
  const bonusLine = c.bonus
    ? "加分：" + c.bonusReasons.join("；") + " → +" + c.bonus
    : "加分：无";

  const dimLines = DIM_KEYS.map(k =>
    DIM_LABEL[k] + "：" + c.dimNotes[k] + "（权重 " + c.weights[k] + "）"
  ).join("；");

  return '<div class="calc">'
    + '<div><b>分数怎么算：</b>' + esc2(baseLine)
    + "；× 偏好系数 " + f2(c.factor)
    + (c.bonus ? " + 加分 " + c.bonus : "")
    + " = <b>" + f1(r.score) + "</b></div>"
    + '<div class="calc-sub">' + esc2(prefLine) + "。" + esc2(bonusLine) + "。</div>"
    + '<div class="calc-sub">' + esc2("城市：" + c.cityNote + "；方向：" + c.dirNote + "；紧急度：" + c.urgNote) + "。</div>"
    + (c.uncollected ? '<div class="calc-sub">没有填写偏好，六项按等权（各 16）计算。</div>' : "")
    + '<details><summary>每一项匹配度怎么来的</summary>'
    + '<div class="calc-sub">' + esc2(dimLines) + "。</div>"
    + '</details>'
    + '</div>';
}

function renderJobs(r){
  const jobs = r.jobs || [];
  if (!jobs.length) {
    return '<div class="jobbox job-empty">未查到岗位：以上分数只用企业城市、性质、方向和偏好计算，没有岗位信息加成。'
      + '<button class="jobfill" data-name="' + esc2(r.name) + '">补岗位</button></div>';
  }
  const body = jobs.map(j => {
    const tags = [];
    if (j.urgency && j.urgency !== "未知") tags.push("紧急度 " + j.urgency);
    if (j.headcount !== "未知" && j.headcount != null) tags.push("招聘 " + j.headcount + " 人");
    if (j.salary && j.salary !== "未知") tags.push(j.salary);
    if (j.group && j.group !== "未知") tags.push(j.group);
    return '<div class="job"><div class="job-h"><b>' + esc2(j.title || "未知")
      + '</b><span>' + esc2(tags.join(" · ")) + "</span></div>"
      + (j.requirements && j.requirements !== "未知"
          ? '<div class="job-req">' + esc2(j.requirements) + "</div>" : "")
      + "</div>";
  }).join("");
  return '<details class="jobbox"><summary>岗位与要求（' + jobs.length + " 个）</summary>"
    + body + "</details>";
}

    +   '<div class="mc-body" id="mcontents-body"></div>'
    + '</dialog>'
    + (rosterOnly ? '' : '<div id="mres"></div>');

  const chat = document.getElementById("chat");

  const stat = wrap.querySelector("#mstat");

  let lastSearchReport = null;

  // 手动补岗位：资料不全的企业可以贴招聘页链接或岗位文本（结果区仅在匹配端渲染）

  wrap.querySelector("#mcontents-close").addEventListener("click", () => contentsDialog.close());
  contentsDialog.addEventListener("click", ev => {
    if (ev.target === contentsDialog) contentsDialog.close();
  });

  /* 企业名判定：与服务端 portal.looks_like_company 同口径。
     以前这里只要求「4~40 字、含中文」，于是 CSV 表头「所属行业」、岗位列
     「人事行政、财务」都被当成企业名塞进名单，检索时白跑一趟还显示「未找到」。 */
  const CO_RE = /公司|集团|银行|支行|分行|营业部|研究院|研究所|设计院|科学院|大学|学院|医院|中心|事务所|事业单位|出版社|报社|杂志社|合作社|(?:财政|税务|市场监督|生态环境|人力资源|统计|气象|地震|邮政|铁路|海关|药监|烟草)局|(?:机械|印刷|纺织|食品|化工|电子|建材|造纸|钢铁|冶炼|加工|制造)厂/;
  const HEAD_RE = /^(序号|编号|企业名称|公司名称|单位名称|企业|单位|公司名|所属行业|行业|单位性质|性质|展位号|展位|招聘岗位数|岗位数|岗位方向|岗位|备注|说明|地址|联系人|联系电话|电话|人数|专业|学历|要求)$/;

  function pickNames(text, strict){
    return String(text || "").split(/[\n\r,，、;；\t]+/)
      .map(s => s.replace(/^\s*\d+[\s.、)）]*/, "").replace(/["']/g, "").trim())
      .filter(s => s.length >= 4 && s.length <= 40 && /[\u4e00-\u9fa5A-Za-z]/.test(s))
      .filter(s => !HEAD_RE.test(s))
      .filter(s => !/序号|岗位|专业|人数|展位|备注|要求|所属行业|单位性质/.test(s))
      .filter(s => (strict ? CO_RE.test(s) : true))
      .filter((s, i, arr) => arr.indexOf(s) === i);
  }

  /* 先按严格口径（必须有 公司/集团/银行… 这类后缀）解析；一个都没有才退回
     宽松口径——粘贴的短名单（「华为」「小米」）还能用，CSV 表头/备注列又进不来。 */
  function pickNamesSmart(text){
    const strict = pickNames(text, true);
    return strict.length ? strict : pickNames(text, false);
  }

  function addToBox(list){
    const have = new Set(pickNames(box.value));
    const add = list.filter(n => !have.has(n));
    box.value = (box.value.trim() ? box.value.trim() + "\n" : "") + add.join("\n");
    return add.length;
  }

  wrap.querySelector("#mfiles").addEventListener("change", ev => {
    const files = Array.from(ev.target.files || []);
    if (!files.length) return;

    files.forEach(f => {
      const isText = /\.(txt|csv|md|text)$/i.test(f.name);
      const isXlsx = /\.(xlsx|xlsm)$/i.test(f.name);
      const isOldXls = /\.xls$/i.test(f.name);

      const chip = document.createElement("span");
      chip.className = "chip";
      chip.innerHTML = '<b>' + esc2(f.name) + '</b>';
      fileList.appendChild(chip);

      const fail = msg => {
        chip.style.background = "#fdecec";
        chip.style.color = "#b4453f";
        chip.innerHTML = '<b>' + esc2(f.name) + '</b>（' + esc2(msg) + '）';
      };

      if (isOldXls) { fail("请另存为 xlsx 或 csv"); return; }

      if (isXlsx) {
        chip.innerHTML = '<b>' + esc2(f.name) + '</b> 解析中…';
        /* 文件名放查询串，不放请求头：头只能用 ISO-8859-1，中文文件名会让
           fetch 直接抛错（页面上显示「本地服务没起来」，请求根本没发出去）。 */
        fetch("/api/names?f=" + encodeURIComponent(f.name), { method: "POST", body: f })
          .then(r => r.json())
          .then(d => {
            if (!d.ok) { fail(d.error || "解析失败"); return; }
            const n = addToBox(d.names || []);
            if (!n) {                       // 解析成功但一个都没认出：别只说 +0
              fail((d.count ? "读到 " + d.count + " 条但都不像企业名" : "没认出企业名") +
                   "，检查是不是名称列不对，或直接粘贴名单");
              return;
            }
            chip.innerHTML = '<b>' + esc2(f.name) + '</b> +' + n;
            stat.textContent = "已从 Excel 读到 " + pickNamesSmart(box.value).length + " 家。";
          })
          .catch(() => fail("本地服务没起来"));
        return;
      }

      if (!isText) { fail("只读 txt / csv / md / xlsx"); return; }

      /* 编码：Excel「另存为 CSV」默认是 GBK，按 utf-8 硬读会整片变问号，
         名单直接归零。先按 utf-8 解，出现替换字符就退回 GBK 再解一次。 */
      f.arrayBuffer().then(buf => {
        let text = "";
        try {
          text = new TextDecoder("utf-8").decode(buf);
          if (text.indexOf("\uFFFD") >= 0) {
            try { text = new TextDecoder("gbk").decode(buf); } catch (e) {}
          }
        } catch (e) {
          fail("这个文件读不出来");
          return;
        }
        const n = addToBox(pickNamesSmart(text));
        if (!n) {
          fail("没认出企业名，检查是不是名称列不对，或直接粘贴名单");
          return;
        }
        chip.innerHTML = '<b>' + esc2(f.name) + '</b> +' + n;
        stat.textContent = "已从文件读到 " + pickNamesSmart(box.value).length + " 家。";
      }).catch(() => fail("这个文件读不出来"));
    });
    ev.target.value = "";
  });

  wrap.querySelector("#mfill").addEventListener("click", () => {
    box.value = BUILTIN_NAMES.join("\n");
    stat.textContent = "已放入内置名单 " + BUILTIN_NAMES.length + " 家。";
  });


  wrap.querySelector("#mlookup").addEventListener("click", async () => {
    const btn = wrap.querySelector("#mlookup");
    const raw = box.value.trim();
    const all = raw ? pickNamesSmart(raw) : BUILTIN_NAMES.slice();
    if (!all.length) { stat.textContent = "先导入或粘贴企业名单。"; return; }

    const CHUNK = 8;
    let done = 0, gotTotal = 0, missTotal = 0, addedTotal = 0;
    const started = Date.now();
    const report = {
      mode: "full", inputCount: all.length, candidates: all.slice(),
      excludedNames: [], companies: [], missed: [],
      completed: 0, finished: false, failed: false, error: ""
    };
    updateSearchReport(report);

    btn.disabled = true;
    btn.textContent = "搜索中…";
    stat.innerHTML = "正在从本地数据库读取企业名单…";

    for (let i = 0; i < all.length; i += CHUNK) {
      const batch = all.slice(i, i + CHUNK);
      const eta = done ? Math.round((Date.now() - started) / done * (all.length - done) / 1000) : "?";
      stat.innerHTML = "正在查找企业档案与校招公告（<b>" + done + " / " + all.length + "</b>）…"
        + " 已补到 " + gotTotal + " 家 · 约剩 " + eta + " 秒";
      try {
        const r = await fetch("/api/lookup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ names: batch })
        });
        const data = await r.json();
        const got = data.companies || [];
        const missed = data.missed || [];
        gotTotal += got.length;
        missTotal += missed.length;
        report.companies.push(...got);
        report.missed.push(...missed);
        report.completed = Math.min(all.length, i + batch.length);
        updateSearchReport(report);

        // 没抓到岗位的企业也放进匹配池，避免 43 家初筛最后只剩有岗位的 10 家。
        const incoming = [...got, ...missed];
        const byName = new Map();
        incoming.forEach(c => {
          const prev = byName.get(c.name);
          if (!prev || ((c.jobs || []).length > (prev.jobs || []).length)) byName.set(c.name, c);
        });
        POOL = POOL.map(c => byName.get(c.name) || c);
        const known = new Set(POOL.map(c => c.name));
        const fresh = [...byName.values()].filter(c => !known.has(c.name));
        POOL = POOL.concat(fresh);
        addedTotal += fresh.length;
      } catch (e) {
        report.failed = true;
        const firstFail = (i === 0 && gotTotal === 0);
        report.error = firstFail ? "连不上本地服务 本地服务（第一批就失败）" : "中途失败，本地服务可能断了";
        report.finished = true;
        updateSearchReport(report);
        if (firstFail) {
          stat.innerHTML = "⚠️ 连不上本地服务 <b>本地服务</b>（联网搜索必须连它）。<br>"
            + "请先在 ent_tools 目录运行 <code>python -X utf8 fair_server.py</code>，"
            + "再用 <b>统一入口首页（/）</b> 打开本页重试。<br>"
            + "（走「填完画像直接出报告」的对话流程可离线看结果，那份用的是内置数据。）";
          btn.disabled = false; btn.textContent = "重试";
        } else {
          stat.innerHTML = "中途失败：已补到 " + gotTotal + " 家。点「继续搜索」接着补。";
          btn.disabled = false; btn.textContent = "继续搜索";
        }
        return;
      }
      done = Math.min(all.length, i + CHUNK);
    }
    stat.innerHTML = "正在把结果写回本地缓存…";
    report.finished = true;
    updateSearchReport(report);

    const secs = Math.round((Date.now() - started) / 1000);
    try { localStorage.setItem("companies", JSON.stringify(POOL)); } catch (e) {}
    stat.innerHTML = "搜索完成：名单 <b>" + all.length + "</b> 家 · 补到岗位 <b>"
      + gotTotal + "</b> 家 · 没抓到 <b>" + missTotal + "</b> 家（仍保留，按企业资料参与匹配）· 耗时 "
      + secs + " 秒<br>现在匹配池里共 <b>" + POOL.length + "</b> 家企业。"
      + (rosterOnly
          ? '<br>名单已就绪，<a href="/match.html"><b>去匹配端看排行 →</b></a>'
          : "");
    btn.textContent = "重新搜索";
    btn.disabled = false;
  });

  if (mgoBtn) mgoBtn.addEventListener("click", () => {
    const urlInput = wrap.querySelector("#murl");
    const url = (urlInput.value || "").trim();
    const raw = box.value.trim();
    const names = raw ? pickNamesSmart(raw) : BUILTIN_NAMES.slice();

    const prof = profileFromDoc(doc);

    if (!POOL.length) {
      stat.innerHTML = "还没有企业数据。先点上面的「联网补全企业画像」，"
        + "抓到的企业会自动加进来。";
      return;
    }

    const rows = match(POOL, prof);

    const covered = new Set(POOL.map(c => c.name));
    const pending = names.filter(n => !covered.has(n)).length;

    res.innerHTML = TIER_META.map(t => {
      const list = rows.filter(r => r.tier === t.key);
      if (!list.length) return "";
      return '<div class="tier ' + t.cls + '">'
        + '<div class="tier-h">' + t.key + ' ' + list.length + ' 家 <em>' + t.note + '</em></div>'
        + list.map(r =>
            '<div class="row">'
            + '<div class="rowhead">'
            +   '<div class="nm"><b>' + esc2(r.name) + '</b>'
            +     '<span class="meta">' + esc2(companyInfoLine(r)) + '</span>'
            +     '<span class="hits">命中：' + esc2(r.hitLine) + '</span>'
            +     (r.missLine ? '<span class="misses">没中：' + esc2(r.missLine) + '</span>' : '')
            +   '</div>'
            +   '<div class="sc">' + r.score.toFixed(1) + '<em>分</em></div>'
            + '</div>'
            + renderCalc(r)
            + renderJobs(r)
            + '</div>').join("")
        + '</div>';
    }).join("");

    const w = weightsOf(prof);
    const wline = DIM_KEYS.filter(k => w.vals[k] > 0)
      .map(k => DIM_LABEL[k] + w.vals[k])
      .join(" · ");

    let extra = "";
    if (url) {
      extra = "<br>网址 <b>" + esc2(url) + "</b>：离线演示不联网，"
            + "正式版这里会去抓公告页并抽取岗位；当前用名单里的企业匹配。";
    }

    stat.innerHTML = "名单 " + names.length + " 家 · "
      + "本次能匹配 " + POOL.length + " 家（有企业画像的）"
      + (pending ? " · 另有 <b>" + pending + "</b> 家尚未采集企业画像" : "")
      + "<br>加权：" + esc2(wline || "未填偏好，按等权")
      + "<br>分数 = 基础分（城市 40 + 方向 35 + 紧急度 25）× 偏好系数（1 + 六项偏好加权/100）+ 加分（企业类型 5 / 家乡 8），最后四舍五入到 1 位小数。"
      + "<br>每家下面会写「命中 / 没中」：城市、方向、紧急度、六项偏好、企业类型、家乡。"
      + "<br>分档：有岗位的企业按分数从高到低，前 30% 为「优先去」，30%–70% 为「可以看」，其余「建议放弃」。"
      + "<br>未查到岗位的企业单独放在「资料不全」，不占上面三档的名额。"
      + extra;

    wrap.querySelector("#mgo").textContent = "重新匹配";
    res.scrollIntoView({ behavior: "smooth", block: "start" });
  });
};

   payload 的 intent_semantics 只覆盖**构建时那份生效画像**的意向。学生换画像 /
   现场新勾一个岗位后，前端拿不到映射，只能退回本地字面规则，报告里如实写
   「本地规则判定」。这里把缺的意向发给服务端补判（每个意向 3–10 秒），拿到后
   并进 D.intent_semantics 再重渲染。离线 / 服务不可用 / 模型超时 → 保持本地兜底，
   不阻塞页面、不编结论。试过的意向记在 semTried 里，避免同一个意向反复打接口。 */
let semTried={}, semNoteTimer=null;
/* 语义服务基址。http(s) 页面一律同源取数（哪个端口就请求哪个端口，
   多实例 8102/8103 各自正确）；只有 file:// 离线打开才回退本机 8102，
   服务端已开 Access-Control-Allow-Origin: *。 */
const SEM_BASE=(function(){

/* 判定结果在本机存一份：换画像切回来、刷新页面都不用再等模型。 */
const SEM_LS='fair_sem_v1:';
function semLoad(x){
  try{
    const s=localStorage.getItem(SEM_LS+x);
    if(!s) return null;
    const v=JSON.parse(s);
    return (v && v.via==='llm' && (v.titles||[]).length) ? v : null;
  }catch(e){ return null; }
}
function semStore(x,v){ try{ localStorage.setItem(SEM_LS+x, JSON.stringify(v)); }catch(e){} }
function semMissing(intents){
  const out=[];
  (intents||[]).forEach(function(x){
    if(!x) return;
    const m=(D.intent_semantics||{})[x];
    if(m && m.via==='llm') return;
    const ls=semLoad(x);
    if(ls){ D.intent_semantics=D.intent_semantics||{}; D.intent_semantics[x]=ls; return; }
    if(semTried[x]) return;
    out.push(x);
  });

}

function ensureSemantics(intents){
  const miss=semMissing(intents);
  if(!miss.length) return;
  miss.forEach(function(x){ semTried[x]=1; });
  semNote('正在让大模型判定：'+miss.join('、')+'（每个约 3–10 秒）');
  function once(isRetry){

      .then(function(j){

            D.intent_semantics[k]=got[k]; semStore(k,got[k]); n++; names.push(k);

        if(n){ semNote('大模型已判定：'+names.join('、')); lastSig=''; render(); }

   只发「未复核」的对子，结果并进同一张 hit_verdicts；拿不到就保持「未复核」，
   不编结论、不阻塞首屏。服务端同样是「一次调用判一批 + pair 级缓存」。 */

function ensureVerify(pairs){
  const todo=[];

    hvTried[k]=1;
    todo.push([p[0],p[1]]);
  });
  if(!todo.length||!SEM_BASE) return;
  fetch(SEM_BASE+'/api/fair/verify',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({pairs:todo})})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(j){
      const v=(j&&j.verdicts)||{};
      const ks=Object.keys(v);
      if(!ks.length) return;
      D.hit_verdicts=D.hit_verdicts||{};
      ks.forEach(function(k){ D.hit_verdicts[k]=v[k]; });
      lastSig=''; render();
    })
    .catch(function(){ /* 复核失败：保持「未复核」标注，不改判、不编结论 */ });
}

  if(!/^https?:$/.test(location.protocol)) return;
  fetch('/api/fair/feedback').then(function(r){return r.json();}).then(function(j){
    if(j&&j.items&&Object.keys(j.items).length){ feedback=j.items; render(); }
  }).catch(function(){});

function saveFeedback(name,result){
  if(!name) return;
  feedback[name]={result:result,note:'',updated_at:new Date().toISOString().slice(0,19)};
  try{ localStorage.setItem('fair_feedback',JSON.stringify(feedback)); }catch(err){}
  visitedSet[name]=1; visited++; remainMin=Math.max(0,remainMin-1);

}

function miIsGenericIntent(s){ return MI_GENERIC_INTENT.some(function(w){ return String(s).indexOf(w)>=0; }); }
/* 方向层级：父类 → 下属细分（与 intent_semantics.DIR_PARENTS 同源）。
   采购/物流/仓储 ⊂ 供应链 → 同一条线照旧算；计划不是供应链专属（生产/核电都有
   计划岗），「计划管培生 × 供应链管培生」是并列方向，不算命中。 */
const MI_PARENTS={'供应链':['采购','物流','仓储']};
function miSameLine(ak,bk){
  if(!ak.length||!bk.length) return false;
  const parents=Object.keys(MI_PARENTS);
  for(let i=0;i<parents.length;i++){
    const ks=MI_PARENTS[parents[i]].concat([parents[i]]);
    if(ak.every(function(w){ return ks.indexOf(w)>=0; })
       && bk.every(function(w){ return ks.indexOf(w)>=0; })) return true;
  }
  return false;
}

const MI_DIRNEUTRAL=['开发','研发','软件','程序','工程师','设计师','技术','应用','系统','岗','员'];

const MI_DUTY=['维护','保养','维修','点检','巡检','检修','调试'];
function miDirCore(t){
  let x=miDirText(t);
  MI_DIRNEUTRAL.forEach(function(w){ x=x.split(w).join(''); });
  return {t:x, k:MI_DIRWORDS.filter(function(w){ return x.indexOf(w)>=0; })};

/* 这一对（岗位 × 意向）能不能算对口：
   ok  算（意向没方向；或岗位没方向；或岗位方向 ⊂ 意向方向）
   ask 值得问一句（同向但岗位更细：测试 → 电气测试 / 器件测试）
   no  不成立（并列方向：后端 × 量化 / 前端 / 嵌入式，同大类两条路）
   与 intent_semantics.pair_verdict 同源。 */
/* 岗位名归一化：与 job_family._norm 逐字符同源（全角括号、顿号、J 码要先抹掉）。 */
function miFuncNorm(s){
  return String(s==null?'':s).replace(/[\s（）()\[\]【】、，,·—\-\/_]+/g,'').toLowerCase();
}
/* 岗位名 → 职能族；认不出来返回 ''（'' 是「不表态」，不是「无职能」）。 */
function miFuncOf(name){
  const x=miFuncNorm(name);
  if(!x) return '';
  for(let i=0;i<MI_FUNC.length;i++){
    if(x.indexOf(MI_FUNC[i][0])>=0) return MI_FUNC[i][1];
  }
  return '';
}
/* 两者是否**明确**属于不同职能。任一侧认不出来就返回 false（不表态）。 */
function miCrossFunc(title,intent){
  const a=miFuncOf(intent);
  if(!a) return false;
  const b=miFuncOf(title);
  return !!b && a!==b;
}
function miPairVerdict(title,intent){
  const a=miDirCore(intent), b=miDirCore(title);
  /* 职能族先判一次：区分「更泛的同类岗」和「另一个职能」。
     放在最前面，让「初级软件工程师 / 开发工程师」这类本身没方向词的意向也受约束。
     与 intent_semantics.pair_verdict 同一处判据逐条同源。 */
  const cross=miCrossFunc(title,intent);

       C++研发 / 自动化 / 电控硬件；岗位职能明确是非研发条线（财务 / 人事 /
       销售 / 设计……且名字里没有研发字样）→ 直接 no，不生成问一句的噪音。 */
    /* 软件条线补闸：miDirCore 剥不出「软件」的方向核，泛研发意向 × 编程条线岗

      const tf=miFuncOf(title);
      if(MI_NONRD.indexOf(tf)>=0 && !miHas(title,['研发','研究','开发'])) return 'no';
      return 'ask';
    }
    return 'ok';

     却和开发不是同一个职能。 */
  if(!b.t) return cross?'no':'ok';
  if(a.t===b.t) return 'ok';

  if(miHas(title,MI_TEACH)!==miHas(intent,MI_TEACH)){
    if(miHas(title,MI_PROFSEQ)||miHas(intent,MI_PROFSEQ)) return 'no';
  }
  /* ② 上位泛学科岗位不能反推具体学科意向：高中学科教师 ≠ 高中化学教师。 */
  if(miHas(title,MI_GENERIC_SUBJ) && MI_SUBJ.some(function(s){ return intent.indexOf(s)>=0; })
     && !MI_SUBJ.some(function(s){ return title.indexOf(s)>=0; })) return 'no';
  /* ③ 两名各带不同的专业方向词（分析 × 环保 / 机械 × 电气）：并列细分，不算同一。
     只在一边有这个、另一边有那个且互不相交时拦，避免两边都含同词误伤。 */
  const td=MI_PROFDIR.filter(function(w){ return title.indexOf(w)>=0; });
  const idr=MI_PROFDIR.filter(function(w){ return intent.indexOf(w)>=0; });
  if(td.length&&idr.length&&!td.some(function(w){ return idr.indexOf(w)>=0; })) return 'no';
  /* ④ 设计方向族：都叫「X设计工程师」，但设计对象不同就是两条路

     与 intent_semantics 的 ④ 逐条同源。 */
  const dgt=miDesignGroup(title), dgi=miDesignGroup(intent);

  /* 注意方向：a=意向方向，b=岗位方向。
     b ⊃ a → 岗位更细（测试 → 器件测试）→ ask；
     b ⊂ a → 岗位更泛（AI算法研究 → 算法）→ ok（小类能进大类）。
     ⑤ 共享动作核 + 不同领域限定词 → no：人工智能算法 × 运动控制算法——都以
     「算法」结尾，前面的领域限定互不包含，是并列领域不是同一个岗（与
     intent_semantics.pair_verdict ⑤ 同源）。ai ≡ 人工智能 先归一。 */
  for(let _i=0;_i<MI_ACTSUF.length;_i++){
    const act=MI_ACTSUF[_i];
    if(a.t.slice(-act.length)===act && b.t.slice(-act.length)===act){
      let pa=a.t.slice(0,a.t.length-act.length), pb=b.t.slice(0,b.t.length-act.length);
      pa=MI_AISYN[pa]||pa; pb=MI_AISYN[pb]||pb;
      if(pa&&pb&&pa.indexOf(pb)<0&&pb.indexOf(pa)<0) return 'no';
    }
  }
  if(a.t.indexOf(b.t)>=0) return 'ok';
  /* 职责词不算方向：设备维护工程师 × 设备工程师 → 同一岗位，不是「更细的方向」 */
  let b2=b.t; MI_DUTY.forEach(function(w){ b2=b2.split(w).join(''); });
  if(b2 && b2===a.t) return 'ok';
  if(b.t.indexOf(a.t)>=0) return 'ask';
  if(a.k.length&&b.k.length&&!a.k.some(function(w){ return b.k.indexOf(w)>=0; })){
    if(miSameLine(a.k,b.k)) return 'ok';   /* 采购/物流/仓储 ⊂ 供应链：同一条线照旧算 */
    return 'no';
  }
  /* 兜底：没互相包含、方向词也没交集（多半是岗位名只有职能没有方向）。
     同职能按原约定放行；明确跨职能的不能兜底当成对口。 */
  return cross?'no':'ok';

/* 方向不一样时，不能说成「另一种说法」：写清是哪个大类下面的哪个方向。
   与 intent_semantics._reason_by_direction 同源。 */
function miDirReason(t,intent){
  const a=miDirCore(intent), b=miDirCore(t);
  if(!b.t||a.t===b.t||(a.t&&b.t.indexOf(a.t)>=0)) return '';
  if(a.k.length&&b.k.length&&!a.k.some(function(w){ return b.k.indexOf(w)>=0; })){
    if(miSameLine(a.k,b.k))
      return '「'+t+'」是「'+intent+'」条线下的'+b.t+'细分（同一条线）';
    return '「'+t+'」与「'+intent+'」同属一个大类但方向不同（'+b.t+' × '+a.t+'）';
  }
  if(!a.t) return '「'+t+'」是「'+intent+'」下的'+b.t+'方向（同一大类，不是同一细分）';
  if(a.t&&b.t.indexOf(a.t)>=0) return '「'+t+'」的方向是'+b.t+'，比「'+intent+'」细，不是同一个岗位';
  return '';

const MI_LV_CAMPUSMAX=3;
const MI_LVNAME={0:'未识别',1:'实习/见习',2:'校招初入',3:'常规经验岗',4:'资深/主管',5:'管理/专家'};
const MI_LV_LEAD=['总经理','副总经理','总监','首席','合伙人','董事','总裁','经理','负责人','专家','VP','CTO','CEO','CFO','COO'];
/* 名里带「经理」但校招照招的前台业务岗 / 产品岗 */
const MI_LV_LEADEX=['客户经理','大堂经理','值班经理','产品经理','业务经理','客户成功经理','理财经理'];
const MI_LV_SENIOR=['资深','高级','主管','组长','班长','科长','主任','主办','督导','领班','Sr.','Senior'];
const MI_LV_ENTRY=['管培','培训生','校招','应届','储备','储干','专员','助理','初级','专工','专责','干部','实习生'];
const MI_LV_INTERN=['实习','见习'];
const MI_LV_ASSIST=['助理','秘书'];
/* 「高级」不表示资历的固定搭配（高级中学）／「主任」不表示管理岗的固定搭配（班主任） */
const MI_LV_SENIORFALSE=['高级中学','高级技工学校','高级技校','班主任','主任委员'];
/* 能独立成岗的收尾字：只有每段都像独立岗位名时才按「/」拆开分档。
   反例「新市场/新项目开发经理」——斜杠分的是业务对象，拆开会把开发经理误判成常规档。 */
const MI_LV_JOBTAIL=['员','师','生','岗','助','理','管','监','任','工','长','代表','顾问','专员','主管','经理','干部','储干','业'];
function miRm(s,w){ return String(s).split(w).join(''); }
function miLvHas(s,arr){ return arr.some(function(k){ return s.indexOf(k)>=0; }); }
function miLvOne(t){
  if(!t) return 0;
  let scan=String(t);
  MI_LV_SENIORFALSE.forEach(function(w){ scan=miRm(scan,w); });
  if(MI_LV_ASSIST.some(function(w){ return t.slice(-w.length)===w; })) return 3;
  let probe=scan;
  MI_LV_LEADEX.forEach(function(w){ probe=miRm(probe,w); });
  if(miLvHas(probe,MI_LV_LEAD)) return 5;
  if(miLvHas(scan,MI_LV_SENIOR)) return 4;
  if(miLvHas(scan,MI_LV_INTERN)) return 1;
  if(miLvHas(scan,MI_LV_ENTRY)) return 2;
  return 3;
}
function miLvSegs(t){
  const raw=String(t).replace(/、/g,'/').split('/').filter(function(s){ return s.length>0; });
  if(raw.length<=1) return [t];
  const okAll=raw.every(function(s){
    return s.length>=2 && MI_LV_JOBTAIL.some(function(w){ return s.slice(-w.length)===w; });
  });
  return okAll ? raw : [t];
}
function miLevel(t){
  const s=String(t==null?'':t).replace(/（/g,'(').replace(/）/g,')').replace(/　/g,' ').trim();
  if(!s) return 0;
  let best=0;
  miLvSegs(s).forEach(function(seg){ const lv=miLvOne(seg); if(lv && (!best || lv<best)) best=lv; });
  return best;
}
/* 意向 a 能否投岗位 b：应届口径 1~3 档；意向本身是资深/管理岗时才放开到 5 档。 */
function miLevelOk(a,b){
  const tl=miLevel(b); if(!tl) return true;
  const il=miLevel(a);
  const cap=(il>=4)?5:MI_LV_CAMPUSMAX;
  if(tl>cap) return false;
  if(il && il<=2 && tl-il>=2) return false;
  if(il>=4 && tl<=2) return false;
  return true;
}
/* 不是岗位的写法：招聘批次名 / 专业类目名 / 事业单位招考名目 */
const MI_LV_NONJOB=['公务员','参公人员','事业编制','专业技术人员','科学研究人员'];
function miIsJob(t){
  const s=String(t==null?'':t).trim();
  if(!s) return false;
  if(MI_LV_NONJOB.indexOf(s)>=0) return false;
  if(s.indexOf('校园招聘')>=0) return false;
  if(s.indexOf('届')>=0 && /\d/.test(s)) return false;
  if(s.slice(-1)==='类' && s.length<=8) return false;
  if(s.slice(-2)==='专业' || s.indexOf('及其自动化')>=0) return false;
  return true;
}
function miGrams(s){ s=String(s||''); const o=[]; for(let i=0;i+1<s.length;i++) o.push(s.substr(i,2)); return o; }
/* 同义写法归一：「营运」就是「运营」（营运管培生 / 营运中台管培生）。
   行业简称同上：「自控 / 工控 / 仪控 / 集控」都是「控制」，「机修 / 点检」是设备岗的
   两种现场说法——东明石化写「自控工程师」、学生意向「控制工程师」，不归一永远对不上。
   与 intent_semantics.SYNONYMS 逐条同源。
   注意替换顺序：先长后短在这里不敏感（各词互不为前缀），但保持与 Python 一致。 */
function miSyn(s){
  return String(s||'')
    .replace(/营运/g,'运营')
    .replace(/自控/g,'控制').replace(/工控/g,'控制')
    .replace(/仪控/g,'控制').replace(/集控/g,'控制')
    .replace(/机修/g,'设备维修').replace(/点检/g,'设备点检');
}
function miFam(t){ const o=[]; for(const k in MI_FAM){ if(miHas(t,MI_FAM[k])) o.push(k); } return o; }
function miShare(a,b){
  a=miSyn(a); b=miSyn(b);
  const g=miGrams(a).filter(function(x){ return MI_GEN.indexOf(x)<0; });
  /* 2 字窗口会跨词边界造假共享：「风险管理岗」的「理岗」落在「施工管理岗」尾部，
     「采购寻源专员」的「源专」落在「人力资源专员」中间。以岗位后缀字收尾的共享
     不算证据（见 intent_semantics.BOUNDARY_TAIL）。 */
  const shared=g.filter(function(x){ return b.indexOf(x)>=0; });
  if(shared.some(function(x){ return MI_TAIL.indexOf(x.slice(-1))<0; })) return true;
  /* 词首片段不受边界规则约束：那条规则只为挡「风险管理岗」里跨词造出的「理岗」，
     而「施工管理岗」开头就是「施工」。旧版把它当边界片段扔掉，
     「施工员」这个最标准的施工管理入口就永远判不成对口。 */
  if(shared.some(function(x){ return a.indexOf(x)===0; })) return true;
  if(MI_GENERIC.indexOf(a)>=0 && miGrams(a).some(function(x){ return b.indexOf(x)>=0; })) return true;
  /* 意向本身是业务/销售型（外贸业务员、客户经理）时，「销售 xxx」就是同一类 */
  if(miHas(a,MI_SALES) && b.indexOf('销售')>=0) return true;
  /* 软件类意向：前端 / 后端 / 嵌入式 / 全栈 等细分方向是同一职能入口（规则 4c）。
     与 intent_semantics.DEV_TITLE_HINTS 同源。 */
  if(miSoftBroad(a) && miHas(b,MI_DEVHINT)) return true;
  const fa=miFam(a), fb=miFam(b);
  if(!fa.some(function(x){ return fb.indexOf(x)>=0; })) return false;
  return !MI_TECH.some(function(w){ return b.indexOf(w)>=0 && a.indexOf(w)<0; });
}
function miRole(a,b,ignoreLevel){
  if(MI_GENERIC.indexOf(b)>=0 && MI_GENERIC.indexOf(a)<0) return false;
  /* 大类不能反推小类：「管培生 / 研究员 / 专员」不带方向，不能算「供应链管培生 /
     量化研究员 / 数据分析岗」的对口证据。公司业务就是这个细分的例外，
     由 miMatch / miAskJobs 用 miBizOk 单独放行，不在这里开口子。 */
  if(miBareGeneric(b) && !miBareGeneric(a)) return false;
  /* 专业名称 / 招聘批次名不是岗位（「电气工程及其自动化」「2027 届校园招聘」） */
  if(/及其自动化|专业$/.test(b) || b.indexOf('校园招聘')>=0 || /\d{4}\s*届/.test(b)) return false;
  const sa=MI_SUBJ.filter(function(s){ return a.indexOf(s)>=0; });
  const sb=MI_SUBJ.filter(function(s){ return b.indexOf(s)>=0; });
  if(sa.length && sb.length && !sa.some(function(s){ return sb.indexOf(s)>=0; })) return false;
  const fam=miFam(a).some(function(x){ return miFam(b).indexOf(x)>=0; });
  if(b.indexOf('销售')>=0 && !miHas(a,MI_SALES)) return false;
  if(miHas(b,MI_PROD) && !miHas(a,['产品','市场','营销','运营'])) return false;
  /* 数据类意向只收真的碰数据的岗位（化学分析 / 力学分析 / 质量分析 不算） */
  if(a.indexOf('数据')>=0 && !miHas(b,MI_DATATITLE)) return false;
  if(miHas(b,MI_OPS) && a.indexOf('运营')<0 && !fam) return false;
  /* 运营意图不收内容 / 电商 / 产品线的运营岗（新媒体运营、电商运营、产品运营） */
  if(a.indexOf('运营')>=0 && !miHas(a,MI_OPSCONTENT) && miHas(b,MI_OPSCONTENT)) return false;
  if(b.indexOf('柜员')>=0 && a.indexOf('柜员')<0) return false;
  if(b.indexOf('总监')>=0 && a.indexOf('总监')<0) return false;
  if((b.indexOf('仓库')>=0||b.indexOf('仓管')>=0) && !miHas(a,['仓','物流','供应链','采购'])) return false;
  if(miHas(b,MI_FIN) && !miHas(a,MI_FIN)) return false;
  if(b.indexOf('战略')>=0 && a.indexOf('战略')<0) return false;
  if(b.indexOf('数据库')>=0 && a.indexOf('数据库')<0) return false;
  /* 跨专业设计岗：机械设计工程师 不吃 模拟IC / 光学 / 电磁 设计岗 */
  if(b.indexOf('设计')>=0 && MI_DESIGN.some(function(f){ return b.indexOf(f)>=0 && a.indexOf(f)<0; })) return false;
  /* 质量类意向：岗位名自己写着「质量」时，测试 / 研究员 是质量岗的常规叫法 */
  const qual = a.indexOf('质量')>=0 && b.indexOf('质量')>=0;
  const soft=miHas(a,MI_SOFT);
  /* 制造业方向词在供应链语境下是正当同类（生产计划 / 供应链事业群管培生-设备方向），
     孤立的生产、设备、工艺岗仍按跨职能拦掉（下面 fam 不相交）。 */
  const supCtx = miHas(b,['计划','供应链','物流','采购','PMC']);
  for(let i=0;i<MI_CONFLICT.length;i++){
    const k=MI_CONFLICT[i];
    if(b.indexOf(k)>=0 && a.indexOf(k)<0){
      if(soft && MI_DEV.indexOf(k)>=0) continue;
      if(qual && (k==='测试'||k==='研究员')) continue;
      if((k==='生产'||k==='设备'||k==='工艺') && supCtx && fam) continue;
      /* 业务环节词只是岗位名的**前缀语境**，不改变方向：「生产设备管理员」对
         「设备工程师」、「生产管培生」对「管培生」都是同一方向。旧版只认供应链
         语境，于是药业的「生产设备管理员」这类最标准的设备岗被挡掉，企业明明
         有设备岗却显示「推断待核实」。判据用 miShare（与 Python _share_core 同源）。 */
      if((k==='生产'||k==='工艺'||k==='质检') && miShare(a,b)) continue;
      /* 研发 / 开发工程师：只放给真正做工程设计的意向（机械设计、电气、结构），
         且岗位名不能是软件研发岗（数据开发 / AI / 低代码）或别的设计方向（光学 / IC）。 */
      if((k==='研发'||k==='开发工程师') && miHas(a,['设计','工程师','研发','开发','机械','电气'])){
        if(!soft && miHas(b,MI_SOFTTITLE)) return false;
        if(MI_DESIGN.some(function(f){ return b.indexOf(f)>=0 && a.indexOf(f)<0; })) return false;
        if(fam || miHas(a,MI_ENGDESIGN)) continue;
      }
      return false;
    }
  }
  /* 层级：同一职能内「主管 / 资深 / 经理」与「管培生 / 专员」是两档人。
     应届只认实习 / 校招初入 / 常规经验岗；更高档不算对口（企业不删、只说层级不符）。
     ignoreLevel=true 只用于「找出被层级挡下的岗位」那一步，别的地方不要传。 */
  if(!ignoreLevel && !miLevelOk(a,b)) return false;
  return true;
}
/* 同职能、但档位比应届可投的高 —— 与 intent_semantics.level_blocked 同口径。
   换画像时 payload 里那份是按旧画像算的，必须按当前意向重算，否则永远显示那 2 家。 */
function miLevelBlocked(intended,titles){
  const out=[];
  (titles||[]).forEach(function(t){
    if(!t || !miIsJob(t)) return;
    const tl=miLevel(t);
    for(let i=0;i<(intended||[]).length;i++){
      const a=intended[i];
      if(!a) continue;
      if(!miRole(a,t,true) || !miShare(a,t)) continue;
      if(!miLevelOk(a,t)){
        out.push({job:t, intent:a, level:(MI_LVNAME[tl]||'资深/管理')});
        break;
      }
      break;   // 同职能且层级也合适 → 这家有这个岗位的正常入口，不必提示
    }
  });
  return out;
}
function miMatch(a,pool,biz){
  for(let i=0;i<pool.length;i++){
    const t=pool[i];
    if(!t) continue;
    if(t===a) return t;
    if(t.indexOf(a)>=0 || (t.length>=4 && a.indexOf(t)>=0)){
      /* 泛研发意向不能靠「字面包含」吃下带方向的岗位（研发工程师 ⊂ C++研发工程师）：
         方向必须与学生方向域或主营相容、由后端裁决；本地重算时只留给现场问。
         软件条线岗同理——miDirCore 剥不出「软件」的方向核，必须用词表补闸
         （软件研发工程师 ⊂ 研发工程师 曾绕过闸硬命中）。与 ⓪ 同源。 */
      if(miSoftBroad(a) && ((miDirCore(t).t && miDirCore(t).t!==miDirCore(a).t)
                            || (miHas(t,MI_SOFTLINE) && !miHas(a,MI_SOFTLINE)))) continue;
      return t;
    }
    /* 大类岗位名：只有公司业务就是这个细分**且不是轮岗类**时才算对口
       （供应链公司的「商务专员」）；轮岗类（管培生 / 培训生 / 储备干部）
       即使业务对口也不硬命中 —— 先轮岗后定岗，岗位名没有「就是干这个」的
       证据（科力普「管理培训生」×物流专员 曾被 biz_ok 短路成语义命中）。
       一律留给 miAskJobs 变成现场提问。与 intent_semantics 同源（2026-11-16）。 */
    if(miBareGeneric(t) && !miBareGeneric(a)){
      if(!miIsRotation(t) && miBizOk(a,biz)) return t;
      continue;
    }
    /* 岗位名比意向宽一层（算法工程师 × AI算法研究工程师）：不算对口，
       留给 miAskJobs 变成现场提问；除非公司业务就是这个细分。 */
    if(miWider(t,a)){
      if(miBizOk(a,biz)) return t;
      continue;
    }
    if(miPairVerdict(t,a)==='no') continue;   /* 并列方向不算命中（后端 × 量化 / 前端） */
    /* 泛研发意向的 ask（量化开发 × 开发工程师）：方向未定，不冒充命中，
       转现场问 —— 与后端 align_jobs_detail 的 ⓪/R2 出口同一口径。 */
    if(miPairVerdict(t,a)==='ask' && miSoftBroad(a)) continue;
    if(miRole(a,t) && miShare(a,t)) return t;
  }
  return null;
}

/* 大类岗位名（管培生 / 储备干部 / 研究员）：不是对口证据，但值得现场问一句。 */
function miAskJobs(intended,titles,biz){
  const out=[], seen={};
  (titles||[]).forEach(function(t){
    if(!t || seen[t] || !miIsJob(t)) return;
    /* 纯大类里只留轮岗类（管培生 / 培训生 / 储备干部 / 校招生）；
       研究员 / 助理工程师 / 分析师 / 专员 / 经理 是定向招聘，不问。
       与 intent_semantics.ask_jobs 同源。 */
    const bare=miBareGeneric(t);
    if(bare && !miIsRotation(t)) return;
    for(let i=0;i<(intended||[]).length;i++){
      const a=intended[i];
      if(!a || miBareGeneric(a)) continue;
      /* 业务对口：定向大类岗按对口处理不重复问；轮岗类照问——问句升级为
         「主业对口，大概率往这个方向培养」。与 intent_semantics.ask_jobs 同源。 */
      const hot=miBizOk(a,biz);
      if(hot && !miIsRotation(t)) continue;
      /* 企业主营和这个意向方向毫不相关 → 连问一句都不该有
         （保险公司 / 教育公司的管培生不会定向培养成化学工程师）。 */
      if(!miBizRelated(a,biz)) continue;
      /* 岗位比意向宽一层（算法工程师 × AI算法研究工程师）也值得问一句 */
      const wider=!bare && miWider(t,a) && miRole(a,t) && miShare(a,t);
      if(!bare && !wider) continue;
      seen[t]=1;
      out.push({job:t, intent:a,
        why: bare
          ? (hot
             ? ('这家主业就是「'+a+'」所在的方向，「'+t+'」大概率会往这个条线培养，'
                +'但岗位名没写死方向。现场问一句：轮岗后能否定岗到「'+a+'」。')
             : ('岗位名只写「'+t+'」，没写业务方向；不同企业的「'+t
                +'」按不同条线培养。现场问一句：是招「'+a+'」这个方向，还是统一轮岗后再定岗。'))
          : ('岗位名「'+t+'」只写到「'+(miDirText(t)||t)+'」这一层，比「'+a
             +'」宽，看不出是不是这个细分方向。现场问一句：这个岗具体做「'+a+'」吗。')});
      return;
    }
  });
  return out.slice(0,3);
}

/* 命中复核表（构建期由大模型成批判好）：{"意向||企业岗位名": 0|0.5|1}。
   1   = 确认同类；0 = 复核否决；0.5 = 模型弃权（技术栈相邻 / 信息不足以下结论）；
   键不存在 = 未复核（模型不可用 / 该对不在候选集）。
   0 和 0.5 都不算命中证据，未复核的继续用本地规则但文案如实写「未复核」。 */
function hvGet(intent,job){
  const o=(typeof D!=='undefined'&&D&&D.hit_verdicts)||{};
  const k=String(intent)+'||'+String(job);
  return Object.prototype.hasOwnProperty.call(o,k) ? o[k] : null;
}
/* 是否挡掉命中：否决与弃权都挡（「不确定」不进证据，也不冒充「复核过」）。 */
function hvBlocks(intent,job){
  const v=hvGet(intent,job);
  return v===0 || v===0.5;
}
function matchIntent(titles,intended,sem,jobTitles,biz,dirOk){
  const pool=((jobTitles&&jobTitles.length)?jobTitles:titles)||[];
  const out=[];
  (intended||[]).forEach(function(x){
    const m=(sem||{})[x];
    let hitJob=null, via='', reason='';
    if(m&&m.via==='llm'){
      /* 逐个意向岗位名匹配企业真实岗位名：模型挑出的原词 == 企业岗位名，或企业岗位名
         完整包含该原词（s.length>=4）。禁止反向包含：否则「研究员」会被
         「数据科学算法研究员」误判为同类，「管培生」会被「供应链事业群管培生」误判为同类。
         命中后用该岗位名专属的 reason（模型已写明「即另一种说法」或「大模型判断二者类似工作内容」）。 */
      const reasons=m.reasons||{};
      let picked=null;
      for(let k=0;k<(m.titles||[]).length;k++){
        const s=m.titles[k];
        const ex=pool.filter(function(t){
          return s&&t&&(s===t||(s.length>=4&&t.indexOf(s)>=0)) && miLevelOk(x,t)
            /* 大类岗位名（研究员 / 管培生）不能反推细分意向，除非公司业务就是该细分 */
            && !(miBareGeneric(t) && !miBareGeneric(x) && !miBizOk(x,biz))
            /* 比意向宽一层的岗（算法工程师 × AI算法研究工程师）也不能算命中 */
            && !(miWider(t,x) && !miBizOk(x,biz))
            /* 并列方向（后端 × 量化 / 前端 / 嵌入式）：同大类两条路，不能顶替。
               岗位更细（测试 → 器件测试）原本算命中，但**复核 1 只是「确认同类」，
               不能把 ask 提升成命中**——否则复核表一换，页面命中数就与 payload
               不一致（2026-11-15 实测：客诉质量 × 质量 被判 ask，后端 drop、
               前端按复核 1 算命中，10 家分歧由此而来）。 */
            && miPairVerdict(t,x)!=='no'
            /* 泛研发意向的 ask 不能因「模型挑过」就吃下（研发工程师 × C++研发）：
               复核确认(1)除外——但 ask+复核1 本就不许提升成命中（见下条），
               所以泛意向的 ask 一律转现场问。与后端 ⓪ 同源。 */
            && !(miPairVerdict(t,x)==='ask' && miSoftBroad(x))
            && !(miPairVerdict(t,x)==='ask' && hvGet(x,t)===1)
            /* 复核否决的跨方向岗位不能算命中（食品研发 × 药品研发 只共享「研发」）；
               弃权（0.5）同样不算 —— C++ × 后端这种相邻技术栈不进证据 */
            && !hvBlocks(x,t);
        })[0];
        if(ex){ picked={job:ex, reason:(miDirReason(ex,x)||reasons[s]||m.reason||'大模型判定为同类校招岗位')}; break; }
      }
      if(picked){ hitJob=picked.job; via='llm'; reason=picked.reason; }
      else {
        // 只用「3 字以上」的专属组合词兜底，避免「运营 / 管理 / 业务」这类泛词误伤。
        const kw=pool.filter(function(t){
          return (m.terms||[]).some(function(k){ return k&&k.length>=3&&t&&t.indexOf(k)>=0; })
            && miRole(x,t) && miShare(x,t) && miLevelOk(x,t)
            /* 比意向宽一层的岗（算法工程师 × AI算法研究工程师）不能走这条兜底 */
            && !(miWider(t,x) && !miBizOk(x,biz))
            && miPairVerdict(t,x)!=='no'
            && !(miPairVerdict(t,x)==='ask' && miSoftBroad(x))
            && !(miPairVerdict(t,x)==='ask' && hvGet(x,t)===1)
            && !hvBlocks(x,t);
        });
        if(kw.length){ hitJob=kw[0]; via='llm-term'; reason=m.reason||'同属一类校招岗位'; }
      }
    }
    /* 2026-11-15 统一候选集：模型词表只决定「理由怎么写」，不再当作命中门槛。
       原来 `covered` 会让「模型已覆盖该意向」直接跳过本地规则，于是后端按企业全量
       岗位名判命中（爱旭「工艺」× 工艺工程师），前端却因为模型没挑出这个词而判不命中。
       规则本身有 bareGeneric / wider / pairVerdict 三道闸，不会退回「管培生 ×
       供应链管培生」那种只共享泛词的误命中——这条由 _test_match 的反例段守着。 */
    if(!hitJob){
      /* 逐个候选试，不能只试第一个：miMatch 命中的第一个如果是共享字的跨方向岗位
         （食品研发 × 药品研发），被复核否决后必须继续往下找，否则同一家企业里
         真正的同名岗位会被一起漏掉。
         复核结论 1 → 确认命中并标明是大模型复核的；0 / 0.5 → 跳过这个候选；
         没有结论 → 收下，但文案写「未复核」，不冒充复核过。 */
      let t=null, v=null;
      for(let i=0;i<pool.length;i++){
        const cand=pool[i];
        if(!cand || cand===hitJob) continue;
        /* 字面同名不需要复核，也不许写成「大模型复核过」——它本来就是个同名岗位。 */
        const cv=(cand===x) ? null : hvGet(x,cand);
        if(cv===0 || cv===0.5) continue;
        /* 复核 1 只能确认「本地规则本就判为对口」的对子，不能把同向但更细的岗位
           （质量工程师 × 客诉质量工程师 = ask）提升成命中：后端 align_jobs 只收
           pair_verdict=='ok'，前端若放行，页面命中数就多于 payload。 */
        if(cv===1 && miPairVerdict(cand,x)!=='ok') continue;
        if(miMatch(x,[cand],biz)){ t=cand; v=cv; break; }
      }
      if(t){
        hitJob=t;
        via=(v===1)?'llm-verify':'rule';
        reason=(v===1) ? '大模型复核：与「'+x+'」同属一类校招岗位'
          : (t===x ? '字面同名'
             : (t.indexOf(x)>=0 ? '岗位名里含你的意向岗位名（未复核）'
                : '本地规则判定：同职能不同叫法（未复核）'));
      }
    }
    /* 后端按主营业务方向判定的命中（岗位名不带方向：「工艺工程师」在化工厂是化工
       方向，前端只有字面规则，判不出这一层）。直接采信后端结论，标 via:'dir'，
       否则页面会出现「命中岗位」有、而「岗位语义命中」没有的两栏打架。
       只在用服务端 payload 的当前画像时采信；本地换画像（recompute）不传 dirOk。 */
    if(!hitJob && dirOk && dirOk.length){
      for(let i=0;i<dirOk.length;i++){
        if(pool.indexOf(dirOk[i])>=0){
          hitJob=dirOk[i]; via='dir';
          reason='岗位名不带方向，这家按主营业务判定的方向与你的意向一致';
          break;
        }
      }
    }
    if(hitJob) out.push({intent:x, job:hitJob, via:via, reason:reason});
  });
  return out;
}

   处理、退回关键词通路 —— 与后端 ind_code.normalize 的 UNKNOWN 语义一致，
   不能当成 out 把人毙掉（数据缺口不是企业不符）。 */
const MI_CODES = (function(){
  const m={}; Object.keys(MI_PRO_MAP).forEach(function(f){
    Object.keys(MI_PRO_MAP[f]).forEach(function(c){ m[c]=1; }); });
  return m;
})();
function miCodeFit(major, intent, code){
  const c=String(code||'').trim().toLowerCase();
  if(!c || !MI_CODES[c]) return '';
  code=c;
  const pf=miBizKw(major||'', [intent]).fields;
  if(!pf.length) return '';
  let edge=false;
  for(let i=0;i<pf.length;i++){
    const m=MI_PRO_MAP[pf[i]]; if(!m) continue;
    const v=m[code];
    if(v==='core') return 'core';
    if(v==='edge') edge=true;
  }
  return edge?'edge':'out';
}

function miCleanBiz(s){ let x=String(s||''); BIZ_JUNK.forEach(function(j){ x=x.split(j).join(' '); }); return x.replace(/\\s+/g,' ').trim(); }
function miStripGeneric(s){ const G=['管理培训生','管培生','培训生','储备干部','储干','校招生','专员/助理','仓储管理员','管理员','工程师','技术员','代表','办事员','专员','助理','人员','职员','文员','操作工','实习生','学徒','岗','主管','经理','总监','员']; let x=String(s||'').trim(),p; do{ p=x; G.forEach(function(t){ if(x.indexOf(t)>=0) x=x.split(t).join(''); }); x=x.trim(); }while(x!==p); return x; }
function miBizKw(major,intents){
  const kw={},fields={}; const m=String(major||'');
  BIZ_FIELDS.forEach(function(f){ f[1].forEach(function(mk){ if(mk&&m.indexOf(mk)>=0) fields[f[0]]=1; }); });
  (intents||[]).forEach(function(it){
    const core=miStripGeneric(it); if(!core||core.length<2) return; kw[core]=1;
    /* 意向词命中领域：首个命中的领域生效（与后端 student_domain 的 break 同源
       ——原先无 break 全加，「化工销售」会同时拉进商贸管理领域，前端比后端
       松：一个意向开门全体受益。2026-11-17 对齐。） */
    for(let bi=0;bi<BIZ_FIELDS.length;bi++){
      const f=BIZ_FIELDS[bi];
      if(f[2].some(function(mk){ return mk&&core.indexOf(mk)>=0; })){ fields[f[0]]=1; break; }
    }
  });
  BIZ_FIELDS.forEach(function(f){ if(fields[f[0]]){ f[3].forEach(function(k){ kw[k]=1; }); f[4].forEach(function(k){ kw[k]=1; }); } });
  return {kw:Object.keys(kw), fields:Object.keys(fields)};
}
function miBizHit(fields,biz){
  /* 主营判定 = 强词一票制（与后端 biz_hit 同源）。弱词（分析/检测/商超…）
     只参与岗位名/意向名的方向词匹配 —— 推断命中宁可少标不错标：
     广告分析软件公司曾靠「分析」误过闸。 */
  const x=miCleanBiz(biz); if(!x||!fields||!fields.length) return false;
  for(let i=0;i<BIZ_FIELDS.length;i++){ const f=BIZ_FIELDS[i];
    if(fields.indexOf(f[0])<0) continue;
    for(let j=0;j<f[3].length;j++){ if(x.indexOf(f[3][j])>=0) return true; }
  }
  return false;
}
/* 明确命中复检（与后端 filter_real 同源）：跨行业通用职能/实验室岗直放；
   其余岗位主营强词一票（按意向对各算各的方向集，与 pair_fields 同源：
   销售意向放行商贸类主营，不连带给其他意向放行贸易/零售公司）。 */
/* 跨行业通用职能/实验室岗（与后端 _GENERIC_JOB 同源）：这类岗每家公司都设，
   免查主营直放；领域研发/工艺岗必须主营沾边，否则半导体研发会钻进化学匹配。 */
function miGenericJob(s){
  return /采购|供应商|仓储|物流|供应链|客服|售前|售后|技术支持|EHS|安全工程师|计划员|化验|质检|实验|检验|检测|分析|测试|质量|专利|注册|生产管理|生产计划|生产跟单/.test(String(s||''));
}
/* 岗位名自带方向词（与后端 diagnose 的 name_dir 同源）：公告写的就是
   「材料研发工程师」「化工工艺工程师」，本家公告自证方向，比主营更硬 ——
   原先漏了这一条，明明公告写了方向的岗位还要靠主营放行。 */
function miNameHasDir(job,fields){
  const t=String(job||''); if(!t||!fields||!fields.length) return false;
  for(let i=0;i<BIZ_FIELDS.length;i++){ const f=BIZ_FIELDS[i];
    if(fields.indexOf(f[0])<0) continue;
    for(let j=0;j<f[3].length;j++){ if(t.indexOf(f[3][j])>=0) return true; }
  }
