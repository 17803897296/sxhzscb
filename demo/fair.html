    } else if (baseInfo.dirPart === 0) {
      misses.push("方向（未命中「" + String(prof.direction_interest || "") + "」）");
    }

    if (hot) {
      hits.push("急招（" + (hot.title || "岗位") + "）");
    } else if (baseInfo.urgPart >= 0.6) {
      hits.push("紧急度（中）");
    } else if (baseInfo.urgPart === 0.2) {
      misses.push("紧急度（低）");
    }

    DIM_KEYS.forEach(k => {
      const s = dims[k];
      if (s >= 0.6) {
        hits.push(DIM_LABEL[k] + "（" + shortNote(dimNotes[k]) + "）");
      } else if (s <= 0.1) {
        misses.push(DIM_LABEL[k] + "（" + shortNote(dimNotes[k]) + "）");
      }
    });

    if (types.includes(c.nature)) hits.push("企业类型（" + c.nature + " +5）");
    if (home !== "未知" && c.city === home) hits.push("家乡（" + home + " +8）");
    if (!jobs.length) misses.push("岗位（未查到，方向和紧急度只能按中性分）");

    const hitLine = hits.join(" · ") || "没有明显命中项，主要按中性分计算";
    const missLine = misses.join(" · ");
    const score = Math.round((baseInfo.base * factor + bonus) * 10) / 10;

    return {
      id: c.id, name: c.name, nature: c.nature, city: c.city,
      industry: c.industry || "未知", jobSource: c.jobSource || "未知",
      jobs: jobs,
      score: score,
      line: reasons.join(" · ") || (top ? top.title : "按综合条件"),
      hits: hits, misses: misses, hitLine: hitLine, missLine: missLine,
      gap: jobs.length ? "" : "未查到岗位，仅按企业与地域排序",
      calc: {
        base: baseInfo.base,
        cityPart: baseInfo.cityPart, dirPart: baseInfo.dirPart, urgPart: baseInfo.urgPart,
        cityNote: baseInfo.cityNote, dirNote: baseInfo.dirNote, urgNote: baseInfo.urgNote,
        dims: dims, dimNotes: dimNotes, weights: vals,
        preferencePoints: preferencePoints, factor: factor,
        bonus: bonus, bonusReasons: bonusReasons,
        uncollected: weightInfo.uncollected
      }
    };
  }).sort((a, b) => b.score - a.score);

  const withJobs = scored.filter(r => r.jobs && r.jobs.length);
  const noJobs = scored.filter(r => !(r.jobs && r.jobs.length));

  // 学生选「只看和专业对口的」→ 方向不成立的不进推荐榜，直接压到放弃
  const strict = String(prof.major_fit || "").indexOf("只看") === 0;
  const gated = strict ? withJobs.filter(r => r.calc.dirPart < 0.5) : [];
  const pool = strict ? withJobs.filter(r => r.calc.dirPart >= 0.5) : withJobs;

  pool.forEach((r, i) => {
    const n = pool.length;
    r.tier = i < Math.max(1, Math.round(n * 0.3)) ? "优先去"
           : i < Math.max(2, Math.round(n * 0.7)) ? "可以看" : "建议放弃";
  });
  gated.forEach(r => {
    r.tier = "建议放弃";
    r.line = "专业方向不对口 · " + r.line;
    r.misses.push("方向（你选了「只看专业对口的」，这家不进推荐榜）");
  });
  noJobs.forEach(r => { r.tier = "资料不全"; });

  return pool.concat(gated).concat(noJobs);
}

const esc2 = s => String(s == null ? "" : s).replace(/[&<>"]/g,
  c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

const TIER_META = [
  { key: "优先去",   cls: "t1", note: "先走这几家" },
  { key: "可以看",   cls: "t2", note: "有余力再去" },
  { key: "建议放弃", cls: "t3", note: "别把时间花在这" },
  { key: "资料不全", cls: "t4", note: "未查到岗位，先补数据" }
];

const f1 = n => Number(n || 0).toFixed(1);
const f2 = n => Number(n || 0).toFixed(2);

function companyInfoLine(r){
  const jobs = r.jobs || [];
  return [
    "城市：" + (r.city || "未知"),
    "性质：" + (r.nature || "未知"),
    "行业：" + (r.industry || "未知"),
    jobs.length ? "岗位：" + jobs.length + " 个" : "岗位：未查到",
    "来源：" + (r.jobSource || "未知")
  ].join(" · ");
}

function renderCalc(r){
  const c = r.calc;
  const baseLine = "城市 40×" + f2(c.cityPart) + "=" + f1(40 * c.cityPart)
    + " + 方向 35×" + f2(c.dirPart) + "=" + f1(35 * c.dirPart)
    + " + 紧急度 25×" + f2(c.urgPart) + "=" + f1(25 * c.urgPart)
    + " → 基础分 " + f1(c.base);
  const prefParts = DIM_KEYS.map(k =>
    DIM_LABEL[k] + " " + c.weights[k] + "×" + f2(c.dims[k]) + "=" + f1(c.weights[k] * c.dims[k])
  );
  const prefLine = "偏好：" + prefParts.join(" + ")
    + " = " + f1(c.preferencePoints)
    + " → 系数 1 + " + f1(c.preferencePoints) + "/100 = " + f2(c.factor);
  const bonusLine = c.bonus
    ? "加分：" + c.bonusReasons.join("；") + " → +" + c.bonus
    : "加分：无";

  const dimLines = DIM_KEYS.map(k =>
    DIM_LABEL[k] + "：" + c.dimNotes[k] + "（权重 " + c.weights[k] + "）"
  ).join("；");

  return '<div class="calc">'
    + '<div><b>分数怎么算：</b>' + esc2(baseLine)
    + "；× 偏好系数 " + f2(c.factor)
    + (c.bonus ? " + 加分 " + c.bonus : "")
    + " = <b>" + f1(r.score) + "</b></div>"
    + '<div class="calc-sub">' + esc2(prefLine) + "。" + esc2(bonusLine) + "。</div>"
    + '<div class="calc-sub">' + esc2("城市：" + c.cityNote + "；方向：" + c.dirNote + "；紧急度：" + c.urgNote) + "。</div>"
    + (c.uncollected ? '<div class="calc-sub">没有填写偏好，六项按等权（各 16）计算。</div>' : "")
    + '<details><summary>每一项匹配度怎么来的</summary>'
    + '<div class="calc-sub">' + esc2(dimLines) + "。</div>"
    + '</details>'
    + '</div>';
}

function renderJobs(r){
  const jobs = r.jobs || [];
  if (!jobs.length) {
    return '<div class="jobbox job-empty">未查到岗位：以上分数只用企业城市、性质、方向和偏好计算，没有岗位信息加成。'
      + '<button class="jobfill" data-name="' + esc2(r.name) + '">补岗位</button></div>';
  }
  const body = jobs.map(j => {
    const tags = [];
    if (j.urgency && j.urgency !== "未知") tags.push("紧急度 " + j.urgency);
    if (j.headcount !== "未知" && j.headcount != null) tags.push("招聘 " + j.headcount + " 人");
    if (j.salary && j.salary !== "未知") tags.push(j.salary);
    if (j.group && j.group !== "未知") tags.push(j.group);
    return '<div class="job"><div class="job-h"><b>' + esc2(j.title || "未知")
      + '</b><span>' + esc2(tags.join(" · ")) + "</span></div>"
      + (j.requirements && j.requirements !== "未知"
          ? '<div class="job-req">' + esc2(j.requirements) + "</div>" : "")
      + "</div>";
  }).join("");
  return '<details class="jobbox"><summary>岗位与要求（' + jobs.length + " 个）</summary>"
    + body + "</details>";
}

window.__mountMatch = function(doc){
  if (document.getElementById("matchbox")) return;      // 只挂一次

  const wrap = document.createElement("div");
  wrap.id = "matchbox";
  wrap.innerHTML =
    '<div class="mb-card">'
    + '<h3>接下来：导入参会企业名单</h3>'
    + '<p class="mb-sub">上传名单文件、贴一个网址，或直接粘贴。都可以。</p>'
    + '<div class="mb-inputs">'
    +   '<label class="mb-plus" for="mfiles" title="上传名单文件">+</label>'
    +   '<input id="mfiles" type="file" accept=".txt,.csv,.md,.text,.xlsx,.xls" multiple hidden>'
    +   '<input id="murl" type="url" placeholder="或者贴一个网址（招聘公告 / 名单页）">'
    + '</div>'
    + '<div id="mfilelist"></div>'
    + '<textarea id="mnames" placeholder="也可以直接粘贴，一行一家"></textarea>'
    + '<div class="mb-row">'
    +   '<button type="button" class="mb-ghost" id="mfill">用内置名单（' + BUILTIN_NAMES.length + ' 家）</button>'
    +   '<button type="button" class="mb-ghost" id="mlookup">搜索</button>'
    +   '<button type="button" class="mb-view" id="mcontents" disabled>查看搜索内容</button>'
    +   '<button type="button" class="mb-go" id="mgo">开始匹配</button>'
    + '</div>'
    + '<div class="note" id="mhint" style="margin-top:8px">'
    +   '搜索：对名单里每一家企业，先从本地数据库取已有档案，再联网查找校招公告补全岗位与画像。'
    +   '下方会实时显示进度。没抓到岗位的企业也保留，按企业资料参与匹配。'
    + '</div>'
    + '<div id="mthink"></div>'
    + '<div class="note" id="mstat"></div>'
    + '</div>'
    + '<dialog id="mcontentsdialog" aria-labelledby="mcontents-title">'
    +   '<div class="mc-head"><div><h3 id="mcontents-title">本次搜索内容</h3>'
    +     '<p>这里显示本次实际参与搜索的全部企业，不截断结果。</p></div>'
    +     '<button type="button" class="mc-close" id="mcontents-close" aria-label="关闭">×</button></div>'
    +   '<div class="mc-body" id="mcontents-body"></div>'
    + '</dialog>'
    + '<div id="mres"></div>';

  const chat = document.getElementById("chat");
  (chat || document.body).appendChild(wrap);

  const stat = wrap.querySelector("#mstat");
  const res = wrap.querySelector("#mres");
  const box = wrap.querySelector("#mnames");
  const fileList = wrap.querySelector("#mfilelist");
  const contentsBtn = wrap.querySelector("#mcontents");
  const contentsDialog = wrap.querySelector("#mcontentsdialog");
  const contentsBody = wrap.querySelector("#mcontents-body");
  let lastSearchReport = null;

  // 手动补岗位：资料不全的企业可以贴招聘页链接或岗位文本
  res.addEventListener("click", async ev => {
    const btn = ev.target.closest(".jobfill");
    if (!btn) return;
    const name = btn.dataset.name || "";
    if (!name) return;
    const raw = prompt("粘贴「" + name + "」的招聘页链接，或直接粘贴岗位列表：");
    if (!raw || !raw.trim()) return;
    const isUrl = /^https?:\/\//i.test(raw.trim());
    btn.disabled = true;
    btn.textContent = "补录中…";
    try {
      const r = await fetch("/api/jobs/import", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(isUrl ? { name: name, url: raw.trim() }
                                   : { name: name, text: raw })
      });
      const d = await r.json();
      if (!d.ok) {
        alert(d.error || "补录失败");
        btn.disabled = false;
        btn.textContent = "补岗位";
        return;
      }
      const idx = POOL.findIndex(c => c.name === name);
      if (idx >= 0) POOL[idx] = d.company; else POOL.push(d.company);
      try { localStorage.setItem("companies", JSON.stringify(POOL)); } catch (e) {}
      wrap.querySelector("#mgo").click();
    } catch (e) {
      alert("补录失败：本地服务可能没起来");
      btn.disabled = false;
      btn.textContent = "补岗位";
    }
  });

  function resultMap(report){
    return new Map([...(report.companies || []), ...(report.missed || [])]
      .map(c => [c.name, c]));
  }

  function renderSearchContents(){
    const report = lastSearchReport;
    if (!report) {
      contentsBody.innerHTML = '<div class="mc-empty">还没有搜索记录。先点「搜索」。</div>';
      return;
    }
    const resultByName = resultMap(report);
    const completed = report.completed || 0;
    const jobsCount = (report.companies || []).length;
    const missedCount = (report.missed || []).length;
    const excluded = report.excludedNames || [];
    const items = (report.candidates || []).map((name, index) => {
      const c = resultByName.get(name);
      let badge = "待搜索", badgeClass = "";
      let meta = "", jobs = "";
      if (c) {
        const jobList = c.jobs || [];
        if (jobList.length) {
          badge = "已补全"; badgeClass = "ok";
          jobs = "岗位：" + jobList.map(j => j.title).filter(Boolean).join("、");
        } else {
          badge = "未查到岗位"; badgeClass = "warn";
          jobs = "未抓到可用招聘页，匹配时保持未知。";
        }
        meta = [c.city && c.city !== "未知" ? "城市：" + c.city : "",
                c.industry && c.industry !== "未知" ? "行业：" + c.industry : "",
                c.nature && c.nature !== "未知" ? "性质：" + c.nature : ""]
          .filter(Boolean).join(" · ");
        if (!meta) meta = "企业画像字段均为未知";
      } else if (report.failed && completed <= index) {
        badge = "搜索中断"; badgeClass = "warn";
        meta = report.error || "本地服务未返回结果";
      } else if (completed > index) {
        badge = "等待返回"; badgeClass = "warn";
      }
      return '<div class="mc-item">'
        + '<div class="mc-item-head"><b>' + (index + 1) + '. ' + esc2(name) + '</b>'
        + '<span class="mc-badge ' + badgeClass + '">' + badge + '</span></div>'
        + (meta ? '<div class="mc-meta">' + esc2(meta) + '</div>' : "")
        + (jobs ? '<div class="mc-jobs">' + esc2(jobs) + '</div>' : "")
        + '</div>';
    }).join("");
    const candidateSection = items
      ? '<div class="mc-section"><h4>搜索候选（' + report.candidates.length + ' 家）</h4>'
        + '<div class="mc-list">' + items + '</div></div>'
      : '<div class="mc-section"><h4>搜索候选</h4><div class="mc-empty">没有候选企业。</div></div>';
    const excludedSection = excluded.length
      ? '<div class="mc-section"><h4>初筛已排除（' + excluded.length + ' 家）</h4>'
        + '<div class="mc-list">' + excluded.map(n =>
            '<div class="mc-item"><div class="mc-item-head"><b>' + esc2(n) + '</b>'
            + '<span class="mc-badge warn">初筛排除</span></div></div>').join("") + '</div></div>'
      : "";
    const modeText = "完整搜索";
    contentsBody.innerHTML =
      '<div class="mc-sum">'
      + '<span class="mc-stat">模式 <b>' + modeText + '</b></span>'
      + '<span class="mc-stat">导入 <b>' + report.inputCount + '</b> 家</span>'
      + '<span class="mc-stat">候选 <b>' + report.candidates.length + '</b> 家</span>'
      + '<span class="mc-stat">已处理 <b>' + completed + '</b> 家</span>'
      + '<span class="mc-stat">补全 <b>' + jobsCount + '</b> 家</span>'
      + '<span class="mc-stat">未查到岗位 <b>' + missedCount + '</b> 家</span>'
      + (excluded.length ? '<span class="mc-stat">初筛排除 <b>' + excluded.length + '</b> 家</span>' : "")
      + '</div>'
      + candidateSection + excludedSection
      + (report.finished ? "" : '<div class="mc-empty">搜索仍在进行，重新点击入口可查看最新进度。</div>');
  }

  function updateSearchReport(report){
    lastSearchReport = report;
    contentsBtn.disabled = false;
    contentsBtn.textContent = "查看搜索内容（" + report.candidates.length + "）";
    if (contentsDialog.open) renderSearchContents();
  }

  contentsBtn.addEventListener("click", () => {
    renderSearchContents();
    if (typeof contentsDialog.showModal === "function") contentsDialog.showModal();
    else contentsDialog.setAttribute("open", "");
  });
  wrap.querySelector("#mcontents-close").addEventListener("click", () => contentsDialog.close());
  contentsDialog.addEventListener("click", ev => {
    if (ev.target === contentsDialog) contentsDialog.close();
  });

  function pickNames(text){
    return String(text || "").split(/[\n\r,，、;；\t]+/)
      .map(s => s.replace(/^\s*\d+[\s.、)）]*/, "").replace(/["']/g, "").trim())
      .filter(s => s.length >= 4 && s.length <= 40 && /[\u4e00-\u9fa5A-Za-z]/.test(s))
      .filter(s => !/^(序号|企业名称|单位名称|公司名称|展位号|岗位|备注)$/.test(s))
      .filter((s, i, arr) => arr.indexOf(s) === i);
  }

  function addToBox(list){
    const have = new Set(pickNames(box.value));
    const add = list.filter(n => !have.has(n));
    box.value = (box.value.trim() ? box.value.trim() + "\n" : "") + add.join("\n");
    return add.length;
  }

  wrap.querySelector("#mfiles").addEventListener("change", ev => {
    const files = Array.from(ev.target.files || []);
    if (!files.length) return;

    files.forEach(f => {
      const isText = /\.(txt|csv|md|text)$/i.test(f.name);
      const isXlsx = /\.(xlsx|xlsm)$/i.test(f.name);
      const isOldXls = /\.xls$/i.test(f.name);

      const chip = document.createElement("span");
      chip.className = "chip";
      chip.innerHTML = '<b>' + esc2(f.name) + '</b>';
      fileList.appendChild(chip);

      const fail = msg => {
        chip.style.background = "#fdecec";
        chip.style.color = "#b4453f";
        chip.innerHTML = '<b>' + esc2(f.name) + '</b>（' + esc2(msg) + '）';
      };

      if (isOldXls) { fail("请另存为 xlsx 或 csv"); return; }

      if (isXlsx) {
        chip.innerHTML = '<b>' + esc2(f.name) + '</b> 解析中…';
        fetch("/api/names", { method: "POST", headers: { "X-Filename": f.name }, body: f })
          .then(r => r.json())
          .then(d => {
            if (!d.ok) { fail(d.error || "解析失败"); return; }
            const n = addToBox(d.names || []);
            chip.innerHTML = '<b>' + esc2(f.name) + '</b> +' + n;
            stat.textContent = "已从 Excel 读到 " + pickNames(box.value).length + " 家。";
          })
          .catch(() => fail("本地服务没起来"));
        return;
      }

      if (!isText) { fail("只读 txt / csv / md / xlsx"); return; }

      const reader = new FileReader();
      reader.onload = () => {
        const n = addToBox(pickNames(reader.result));
        chip.innerHTML = '<b>' + esc2(f.name) + '</b> +' + n;
        stat.textContent = "已从文件读到 " + pickNames(box.value).length + " 家。";
      };
      reader.readAsText(f, "utf-8");
    });
    ev.target.value = "";
  });

  wrap.querySelector("#mfill").addEventListener("click", () => {
    box.value = BUILTIN_NAMES.join("\n");
    stat.textContent = "已放入内置名单 " + BUILTIN_NAMES.length + " 家。";
  });


  wrap.querySelector("#mlookup").addEventListener("click", async () => {
    const btn = wrap.querySelector("#mlookup");
    const raw = box.value.trim();
    const all = raw ? pickNames(raw) : BUILTIN_NAMES.slice();
    if (!all.length) { stat.textContent = "先导入或粘贴企业名单。"; return; }

    const CHUNK = 8;
    let done = 0, gotTotal = 0, missTotal = 0, addedTotal = 0;
    const started = Date.now();
    const report = {
      mode: "full", inputCount: all.length, candidates: all.slice(),
      excludedNames: [], companies: [], missed: [],
      completed: 0, finished: false, failed: false, error: ""
    };
    updateSearchReport(report);

    btn.disabled = true;
    btn.textContent = "搜索中…";
    stat.innerHTML = "正在从本地数据库读取企业名单…";

    for (let i = 0; i < all.length; i += CHUNK) {
      const batch = all.slice(i, i + CHUNK);
      const eta = done ? Math.round((Date.now() - started) / done * (all.length - done) / 1000) : "?";
      stat.innerHTML = "正在查找企业档案与校招公告（<b>" + done + " / " + all.length + "</b>）…"
        + " 已补到 " + gotTotal + " 家 · 约剩 " + eta + " 秒";
      try {
        const r = await fetch("/api/lookup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ names: batch })
        });
        const data = await r.json();
        const got = data.companies || [];
        const missed = data.missed || [];
        gotTotal += got.length;
        missTotal += missed.length;
        report.companies.push(...got);
        report.missed.push(...missed);
        report.completed = Math.min(all.length, i + batch.length);
        updateSearchReport(report);

        // 没抓到岗位的企业也放进匹配池，避免 43 家初筛最后只剩有岗位的 10 家。
        const incoming = [...got, ...missed];
        const byName = new Map();
        incoming.forEach(c => {
          const prev = byName.get(c.name);
          if (!prev || ((c.jobs || []).length > (prev.jobs || []).length)) byName.set(c.name, c);
        });
        POOL = POOL.map(c => byName.get(c.name) || c);
        const known = new Set(POOL.map(c => c.name));
        const fresh = [...byName.values()].filter(c => !known.has(c.name));
        POOL = POOL.concat(fresh);
        addedTotal += fresh.length;
      } catch (e) {
        report.failed = true;
        const firstFail = (i === 0 && gotTotal === 0);
        report.error = firstFail ? "连不上本地服务 127.0.0.1:8102（第一批就失败）" : "中途失败，本地服务可能断了";
        report.finished = true;
        updateSearchReport(report);
        if (firstFail) {
          stat.innerHTML = "⚠️ 连不上本地服务 <b>127.0.0.1:8102</b>（联网搜索必须连它）。<br>"
            + "请先在 ent_tools 目录运行 <code>python -X utf8 fair_server.py</code>，"
            + "再用 <b>http://127.0.0.1:8102/fair.html</b> 打开本页重试。<br>"
            + "（走「填完画像直接出报告」的对话流程可离线看结果，那份用的是内置数据。）";
          btn.disabled = false; btn.textContent = "重试";
        } else {
          stat.innerHTML = "中途失败：已补到 " + gotTotal + " 家。点「继续搜索」接着补。";
          btn.disabled = false; btn.textContent = "继续搜索";
        }
        return;
      }
      done = Math.min(all.length, i + CHUNK);
    }
    stat.innerHTML = "正在把结果写回本地缓存…";
    report.finished = true;
    updateSearchReport(report);

    const secs = Math.round((Date.now() - started) / 1000);
    try { localStorage.setItem("companies", JSON.stringify(POOL)); } catch (e) {}
    stat.innerHTML = "搜索完成：名单 <b>" + all.length + "</b> 家 · 补到岗位 <b>"
      + gotTotal + "</b> 家 · 没抓到 <b>" + missTotal + "</b> 家（仍保留，按企业资料参与匹配）· 耗时 "
      + secs + " 秒<br>现在匹配池里共 <b>" + POOL.length + "</b> 家企业。";
    btn.textContent = "重新搜索";
    btn.disabled = false;
  });

  wrap.querySelector("#mgo").addEventListener("click", () => {
    const urlInput = wrap.querySelector("#murl");
    const url = (urlInput.value || "").trim();
    const raw = box.value.trim();
    const names = raw ? pickNames(raw) : BUILTIN_NAMES.slice();

    const prof = profileFromDoc(doc);

    if (!POOL.length) {
      stat.innerHTML = "还没有企业数据。先点上面的「联网补全企业画像」，"
        + "抓到的企业会自动加进来。";
      return;
    }

    const rows = match(POOL, prof);

    const covered = new Set(POOL.map(c => c.name));
    const pending = names.filter(n => !covered.has(n)).length;

    res.innerHTML = TIER_META.map(t => {
      const list = rows.filter(r => r.tier === t.key);
      if (!list.length) return "";
      return '<div class="tier ' + t.cls + '">'
        + '<div class="tier-h">' + t.key + ' ' + list.length + ' 家 <em>' + t.note + '</em></div>'
        + list.map(r =>
            '<div class="row">'
            + '<div class="rowhead">'
            +   '<div class="nm"><b>' + esc2(r.name) + '</b>'
            +     '<span class="meta">' + esc2(companyInfoLine(r)) + '</span>'
            +     '<span class="hits">命中：' + esc2(r.hitLine) + '</span>'
            +     (r.missLine ? '<span class="misses">没中：' + esc2(r.missLine) + '</span>' : '')
            +   '</div>'
            +   '<div class="sc">' + r.score.toFixed(1) + '<em>分</em></div>'
            + '</div>'
            + renderCalc(r)
            + renderJobs(r)
            + '</div>').join("")
        + '</div>';
    }).join("");

    const w = weightsOf(prof);
    const wline = DIM_KEYS.filter(k => w.vals[k] > 0)
      .map(k => DIM_LABEL[k] + w.vals[k])
      .join(" · ");

    let extra = "";
    if (url) {
      extra = "<br>网址 <b>" + esc2(url) + "</b>：离线演示不联网，"
            + "正式版这里会去抓公告页并抽取岗位；当前用名单里的企业匹配。";
    }

    stat.innerHTML = "名单 " + names.length + " 家 · "
      + "本次能匹配 " + POOL.length + " 家（有企业画像的）"
      + (pending ? " · 另有 <b>" + pending + "</b> 家尚未采集企业画像" : "")
      + "<br>加权：" + esc2(wline || "未填偏好，按等权")
      + "<br>分数 = 基础分（城市 40 + 方向 35 + 紧急度 25）× 偏好系数（1 + 六项偏好加权/100）+ 加分（企业类型 5 / 家乡 8），最后四舍五入到 1 位小数。"
      + "<br>每家下面会写「命中 / 没中」：城市、方向、紧急度、六项偏好、企业类型、家乡。"
      + "<br>分档：有岗位的企业按分数从高到低，前 30% 为「优先去」，30%–70% 为「可以看」，其余「建议放弃」。"
      + "<br>未查到岗位的企业单独放在「资料不全」，不占上面三档的名额。"
      + extra;

    wrap.querySelector("#mgo").textContent = "重新匹配";
    res.scrollIntoView({ behavior: "smooth", block: "start" });
  });
};

function refreshFromServer(){

    if(!p || !p.rows || !p.rows.length) return;
    D.rows=p.rows; D.weights=p.weights||D.weights; D.profile=p.profile||D.profile;
    D.stats=p.stats||D.stats; D.sources=p.sources||D.sources;
    if(p.active_fair_id) D.active_fair_id=p.active_fair_id;
    if(p.province_map) PM=p.province_map;

  }).catch(function(){});
}

/* 意向岗位 vs 企业真实岗位名：优先用大模型语义映射判定「是否符合」，
   模型没覆盖到时退回字面/关键词匹配。返回 [{intent, job, via, reason}]。
   jobTitles = 企业校招公告里的真实岗位名（不是模型预生成的 matched_jobs），
   这样报告里显示的命中岗位才和采集端勾选的岗位对得上。 */
function matchIntent(titles,intended,sem,jobTitles){
  const KW=['供应链','数据','分析','计划','研究','量化','算法','开发','产品',
            '运营','采购','物流','财务','销售','工程','项目','风控','交易',
            '顾问','教师','研发','质量','管培','投资'];
  const pool=((jobTitles&&jobTitles.length)?jobTitles:titles)||[];
  const out=[];
  (intended||[]).forEach(function(x){
    const m=(sem||{})[x];
    let hitJob=null, via='', reason='';
    if(m&&m.via==='llm'){
      const exact=pool.filter(function(t){
        return (m.titles||[]).some(function(s){ return s&&t&&(s===t||t.indexOf(s)>=0||s.indexOf(t)>=0); });
      });
      if(exact.length){ hitJob=exact[0]; via='llm'; reason=m.reason||'大模型判定为同类校招岗位'; }
      else {
        // 只用「3 字以上」的专属组合词兜底，避免「运营 / 管理 / 业务」这类泛词误伤。
        const kw=pool.filter(function(t){
          return (m.terms||[]).some(function(k){ return k&&k.length>=3&&t&&t.indexOf(k)>=0; });
        });
        if(kw.length){ hitJob=kw[0]; via='llm-term'; reason=m.reason||'同属一类校招岗位'; }
      }
    }
    if(!hitJob){
      const t=pool.filter(function(t){
        if(t.indexOf(x)>=0||x.indexOf(t)>=0) return true;
        const a=KW.filter(function(k){return x.indexOf(k)>=0;});
        const b=KW.filter(function(k){return t.indexOf(k)>=0;});
        return a.some(function(k){return b.indexOf(k)>=0;});
      })[0];
      if(t){ hitJob=t; via='literal'; reason='字面 / 关键词相近'; }
    }
    if(hitJob) out.push({intent:x, job:hitJob, via:via, reason:reason});
  });
  return out;
}

function short(s,n){ s=String(s||''); return s.length>n ? s.slice(0,n)+'…' : s; }

  if(s==='inferred') return ['t2','按行业推断 · 现场问一句确认'];
  return ['t3','暂不优先'];
}

function calcOne(r,P){

    cityCategories(city).forEach(function(cat){
      if(cr[cat]!=null && (best===null||cr[cat]<best.rank)) best={cat:cat,rank:cr[cat],city:city};
    });

  if(best!==null){
    const v=rankValue(best.rank, RULES.city_cats.length);
    vals.city={v:v, b:'工作城市 '+best.city+' 命中「'+best.cat+'」(你的第'+best.rank+'优先)'};
  }
  /* 离家近：遍历全部工作城市，取离家最近（得分最高）的那个工作地 */
  const home=P.home_city, wcsH=workCities(r);
  if(home){
    let bestH=null;
    wcsH.forEach(function(cc){
      const hp=RULES.PM[cc], hhp=RULES.PM[home];
      let v;
      if(cc===home) v=1.0;
      else if(hp&&hhp&&hp===hhp) v=0.8;
      else if(hhp&&hp&&RULES.adj[hhp]&&RULES.adj[hhp].indexOf(hp)>=0) v=0.6;
      else v=0.3;
      if(bestH===null||v>bestH.v) bestH={v:v, city:cc};
    });
    if(bestH!==null){
      vals.home={v:bestH.v, b:'离家最近的工作地 '+bestH.city+' / 家乡 '+home};
    }
  }
  /* 企业类型：国央企 / 民企 / 外企 三档排名 */
  const b=companyTypeBucket(r.nature);
  const ctr=P.company_type_rank||RULES.ct_rank_def;
  if(b&&ctr[b]!=null){
    const v=rankValue(ctr[b], Object.keys(RULES.ct_buckets).length);
    vals.company_type={v:v, b:'性质 '+r.nature+' → '+b+'(你的第'+ctr[b]+'优先)'};
  }
  /* 行业：对口是硬约束，这里只做排序偏好；不在列表内给中性地板分 */
  const ind=r.industry, ir=P.industry_rank||RULES.ind_rank_def;
  const nind=Object.keys(RULES.ind_rank_def).length;
  if(ind&&ir[ind]!=null){
    const v=rankValue(ir[ind], nind);
    vals.industry={v:v, b:'行业 '+ind+'(你的第'+ir[ind]+'优先)'};
  } else {
    vals.industry={v:0.4, b:'行业 '+(ind||'未知')+'（不在你的偏好排序内）'};
  }
  /* 规模：客观分档，不问用户 */
  const st=r.scale_tier||classifyScale(r.nature, r.name, r.industry);
  if(st&&RULES.scale_tiers[st]!=null){
    vals.scale={v:RULES.scale_tiers[st], b:'规模档 '+st+'（客观判定）'};
  }
  /* 行业地位：读 v4.2 rank_tier（500强/行业龙头等）。无公开榜单给中性地板，不惩罚 */
  const rt=(r.v42&&r.v42.rank_tier)||'';
  if(RULES.industry_status_tiers[rt]!=null){
    vals.industry_status={v:RULES.industry_status_tiers[rt],
      b:'行业地位 '+rt+'（第三方榜单/500强）'};
  } else {
    vals.industry_status={v:RULES.industry_status_floor, b:'无公开榜单（中性，不扣分）'};
  }
  /* 成长性：读 v4.2 growth_tier。无信号给中性地板 */
  const gt=(r.v42&&r.v42.growth_tier)||'none';
  const gv=(RULES.growth_tiers[gt]!=null)?RULES.growth_tiers[gt]:RULES.growth_floor;
  vals.growth={v:gv, b:'成长性 '+gt};

  let pool=0; Object.keys(vals).forEach(function(k){ pool+=(Number(w[k])||0); });
  pool=pool||1;
  const total=Object.keys(w).reduce(function(n,k){return n+(Number(w[k])||0);},0)||100;
  const parts=Object.keys(vals).map(function(k){
    const ww=Number(w[k])||0;
    return {id:k, name:DIM_LABEL[k]||k, weight:ww, value:+vals[k].v.toFixed(2),
            contribution:+(ww/pool*vals[k].v*100).toFixed(1), basis:vals[k].b};
  });
  const score=+parts.reduce(function(n,p){return n+p.contribution;},0).toFixed(1);

  /* 现场提问按当前权重 × 缺口可信度重排 */
  const qs=[];
  if(r.state==='inferred'&&r.infer_notice)
    qs.push({q:'【显著提示】'+r.infer_notice, priority:999, infer:true});
  (r.gaps||[]).forEach(function(g){
    const wk=WMAP[g.kind]||'industry';
    qs.push({q:g.question, priority:+(((Number(w[wk])||10))*(1-g.confidence)).toFixed(1),
             infer:false, why:g.why});
  });
  qs.sort(function(a,b){return b.priority-a.priority;});

  /* 学生勾选的意向岗位 ↔ 企业真实岗位名：大模型语义判定（未覆盖时退回字面匹配） */
  const matches=matchIntent(r.matched_jobs,P.intended_jobs,P.sem,r.job_titles);
  return {score:score, effective_weight:+(pool/total*100).toFixed(1),
          parts:parts, questions:qs.slice(0,2),
          intent_hit:matches.map(function(m){return m.intent;}),
          intent_matches:matches};
}

function recompute(P){
  const rows=BASE.map(function(r){
    const c=calcOne(r,P);
    const x=Object.assign({}, r, c);
    const fb=feedback[r.name];            // v7：现场核实优先于模型推断
    if(fb){
      x.feedback=fb;
      if(fb.result==='yes'){
        if(x.state==='inferred') x.state='hit';
        if(x.trust!=='low') x.trust='high';
        x.check_notes=(x.check_notes||[]).concat(['现场已确认招此岗位，推断升级为明确命中']);
        x.infer_notice='';
        x.questions=(x.questions||[]).filter(function(q){return !q.infer;});
      }
    }
    return x;
  });
  rows.sort(function(a,b){
    const an=(feedback[a.name]||{}).result==='no'?1:0;
    const bn=(feedback[b.name]||{}).result==='no'?1:0;
    return (an-bn) || (ORDER[a.state]-ORDER[b.state]) || (b.priority-a.priority)
        || (b.score-a.score) || a.name.localeCompare(b.name);
  });
  rows.forEach(function(r,i){
    r.rank=i+1;
    r.next=rows[i+1]?rows[i+1].name:'';
    r.rank_reason='队列第 '+(i+1)+' 位：'
      +({hit:'有真实 JD 命中',inferred:'按行业推断待核实',miss:'无对口岗位'})[r.state]
      +' / 优先级 '+r.priority+'；排序分 '+r.score+'（仅 '+r.effective_weight+'% 权重生效）';
    const fb=feedback[r.name];
    if(fb&&fb.result==='yes') r.rank_reason+='；现场已确认招，升级为明确命中';
    if(fb&&fb.result==='no') r.rank_reason+='；现场确认不招，已顺延（保留在队尾供核对）';
  });
  return rows;
}

function trustBadge(r){
  if(r.trust==='low') return '<span style="color:#c0392b;font-weight:650">⚠ 低可信</span>';
  if(r.trust==='medium') return '<span style="color:#b7791f">◐ 待核实</span>';
  return '<span style="color:#0f9960">✓ 与企业端一致</span>';
}
function fbBadge(r){
  const fb=feedback[r.name];
  if(!fb) return '';
  return fb.result==='yes'
    ? '<span style="color:#0f9960;font-weight:650">✓ 现场确认招（已升级）</span>'
    : '<span style="color:#c0392b;font-weight:650">✗ 现场确认不招（已顺延）</span>';
}

function rowBrief(r, idx, P){
  const v=r.v42||{}, sm=r.intent_matches||[];
  const top=(r.parts||[]).slice().sort(function(a,b){return b.contribution-a.contribution;})
    .slice(0,2).map(function(p){return p.name+' '+p.value;});
  const bright=[];
  if(v.industry_rank_label==='榜单在列') bright.push('榜单在列'+(v.rank_tier?' · '+v.rank_tier:''));
  if(v.growth_tier==='rising_star') bright.push('行业新星');
  const line1='展位 '+e(r.booth||'—')+' · '+e(r.industry)+' · '+e(r.nature)
    +' · '+e(short(r.city,10))
    +(bright.length?' · <b>'+e(bright.join(' / '))+'</b>':'')
    +' · '+e(stateLabel(r.state));
  const hit=sm.slice(0,2).map(function(m){return m.job+' ↔ '+m.intent;});
  const focus=top.concat(hit.length?['岗位命中：'+hit.join('；')]:[]);
  const line2=focus.length?e(focus.join(' · ')):'按当前画像计算，暂无特别突出的命中项';
  return '<div class="row" id="tri-'+idx+'">'
   + '<div class="rowhead"><div class="nm"><b>'+e(r.name)+'</b> '+trustBadge(r)+'</div>'
   +   '<div class="sc">'+r.score+'<em>生效权重 '+r.effective_weight+'%</em></div></div>'
   + '<div class="line">'+line1+'</div>'
   + '<div class="line">'+line2+'</div>'
   + '<div class="btns" style="margin-top:6px">'
   +   '<button type="button" class="btn btn-p" data-detail="'+e(r.name)+'">查看完整报告 →</button>'
   + '</div></div>';
}

    +'<b>改了画像或权重，这份报告会自动重算</b>（分数、算分依据、现场提问、队列位次与顺延目标）。<br>'
    +'<b>现场进度</b>：已逛 '+visited+' 家 · 剩余 '+remainMin+' 分钟 · 队列还有 '
      +Math.max(0,rows.length-visited)+' 家待看。点卡片里的按钮会同步推进。'
    +'</div>'
    +'<div class="note" style="font-size:12px;margin:0 0 10px">'
    +'<b>五项权重微调</b>（改完立即重算，不必回采集端重新生成画像）：'
    + Object.keys(P.weights).map(function(k){
        return '<span style="display:inline-block;margin:0 10px 0 0">'
          +e(DIM_LABEL[k]||k)+' <b>'+P.weights[k]+'</b> '
          +'<button type="button" class="btn btn-g" data-wk="'+k+'" data-wd="-5">−5</button> '
          +'<button type="button" class="btn btn-g" data-wk="'+k+'" data-wd="5">+5</button></span>';
      }).join('')
    + ' <button type="button" class="btn btn-g" data-wreset="1">恢复画像权重</button></div>'
    +'<div class="btns" style="margin:0 0 12px">'
    + [['all','全部'],['high','只看高可信'],['infer','只看推断待核实'],['low','只看校验异常']]
        .map(function(x){return '<button type="button" class="btn '+(filter===x[0]?'btn-p':'btn-g')
          +'" data-filter="'+x[0]+'">'+x[1]+'</button>';}).join('')
    + '<button type="button" class="btn btn-g" data-export="1">导出当前队列 JSON</button>'
    + '</div>';

  /* v11：列表页默认只给「按排名 / 按展位排行」两个显示选项。
     原有统计说明、权重微调、筛选、导出一条不删，收进折叠区；
     点企业卡片进另一个页面看完整报告。 */
  let html='';
  if(DETAIL_NAME){
    const t=rows.findIndex(function(r){return r.name===DETAIL_NAME;});
    if(t<0){
      html='<div class="note">没找到企业：'+e(DETAIL_NAME)
        +'。<a href="'+e(location.pathname)+'?report=1">返回排行列表</a></div>';
    }else{
      const cur=rows[t], prevT=rows[t-1], nextT=rows[t+1];
      /* 这条页是「单家企业完整报告」钻取页（由列表「查看完整报告 →」在新标签打开）。
         之前只显示 1 家 +「推荐序第 N 位」，容易被误认为排名塌了。
         这里明确标注「共 M 家 / 当前第 N 位」、加醒目返回、并给上一家/下一家导航。 */
      html='<div class="btns" style="margin:0 0 10px">'
        + '<a class="btn btn-p" href="'+e(location.pathname)+'?report=1">← 返回完整排行列表（共 '
        + rows.length+' 家）</a></div>'
        + '<div class="note" style="font-size:12.5px;margin:0 0 12px;background:#fff7e6;'
        + 'border:1px solid #ffe0a3;border-radius:8px;padding:9px 12px;line-height:1.7">'
        + '⚠ 这是<b>单家企业</b>的完整报告钻取页——列表里一共有 <b>'+rows.length
        + '</b> 家，这里只展开你点的那 1 家（当前推荐序第 <b>'+cur.rank+'</b> 位）。'
        + '排名没有少，点上面「← 返回」即可看全部。</div>'
        + '<div class="btns" style="margin:0 0 12px">'
        + (prevT?'<a class="btn btn-g" href="'+e(location.pathname)
          + '?detail='+encodeURIComponent(prevT.name)+'">← 上一家（第 '+prevT.rank+' 位）</a> ':'')
        + (nextT?'<a class="btn btn-g" href="'+e(location.pathname)
          + '?detail='+encodeURIComponent(nextT.name)+'">下一家（第 '+nextT.rank+' 位）→</a>':'')
        + '</div>'
        + '<div class="note" style="font-size:12px;margin:0 0 12px"><b>完整报告 · '
        + e(cur.name)+'</b>　展位 '+e(cur.booth||'—')
        + ' · 推荐序第 '+cur.rank+' 位 / 共 '+rows.length
        + ' 位 · 排序分 '+cur.score+'　'+live+'</div>'
        + rowHTML(cur, t, P)
        + '<details style="margin:12px 0"><summary style="cursor:pointer;font-size:12px">'
        + '本页完整信息（统计 / 权重微调 / 筛选 / 导出 / 现场进度）</summary>'
        + _infoHtml + '</details>';
    }
  }else{
    html='<div class="note" style="font-size:12px;margin:0 0 10px"><b>共 '
      + D.stats.companies+' 家 / '+D.stats.jobs+' 条岗位</b>　'+live
      + ' · 明确命中 '+D.stats.states.hit+' / 推断 '+D.stats.states.inferred
      + ' / 不对口 '+D.stats.states.miss
      + ' · 意向岗位 '+e((P.intended_jobs||[]).join('、')||'—')+'</div>'
      + '<div class="btns" style="margin:0 0 12px">'
      + '<button type="button" class="btn '+(sortMode==='queue'?'btn-p':'btn-g')
        +'" data-sort="queue">按排名</button>'
      + '<button type="button" class="btn '+(sortMode==='booth'?'btn-p':'btn-g')
        +'" data-sort="booth">按展位排行</button>'
      + '</div>'
      + '<details style="margin:0 0 12px"><summary style="cursor:pointer;font-size:12px">'
      + '更多设置 / 完整信息（统计 · 权重微调 · 筛选 · 导出 · 现场进度）</summary>'
      + _infoHtml + '</details>';
  }
  let idx=0;
  const groups = sortMode==='booth'
    ? [['t1','按会场序列号（展位号）顺序 · 走一遍不折返 · 评分照常显示', rows]]
    : ['hit','inferred','miss'].map(function(s){
        const g=groupTitle(s); return [g[0],g[1],rows.filter(function(r){return r.state===s;})];
      });
  if(!DETAIL_NAME){
    groups.forEach(function(g){
      const rs=g[2];
      if(!rs.length) return;
      html+='<div class="tier '+g[0]+'"><div class="tier-h">'+g[1]+' <em>'+rs.length+' 家</em></div>';
      rs.forEach(function(r){ html+=rowBrief(r,idx++,P); });
      html+='</div>';
    });
  }
  currentRows=rows;
  suppress=true;
  box.innerHTML=html;
  // 详情页本来就是看细节的，折叠区默认展开。
  if(DETAIL_NAME) box.querySelectorAll('.jobbox details').forEach(function(d){ d.open=true; });
  setTimeout(function(){suppress=false;},60);
  box.querySelectorAll('[data-wk]').forEach(function(b){
    b.onclick=function(){
      if(!wOverride) wOverride=Object.assign({},P.weights);
      const k=b.dataset.wk, d=+b.dataset.wd;
      wOverride[k]=Math.max(0,(Number(wOverride[k])||0)+d);
      const sum=Object.keys(wOverride).reduce(function(n,x){return n+wOverride[x];},0)||1;
      Object.keys(wOverride).forEach(function(x){ wOverride[x]=+(wOverride[x]/sum*100).toFixed(1); });
      render();
    };
  });
  box.querySelectorAll('[data-wreset]').forEach(function(b){
    b.onclick=function(){ wOverride=null; render(); };
  });
  box.querySelectorAll('[data-filter]').forEach(function(b){
    b.onclick=function(){ filter=b.dataset.filter; render(); };
  });
  box.querySelectorAll('[data-sort]').forEach(function(b){
    b.onclick=function(){ sortMode=b.dataset.sort||'queue'; render(); };
  });
  box.querySelectorAll('[data-detail]').forEach(function(b){
    b.onclick=function(){
      window.open(location.pathname+'?detail='+encodeURIComponent(b.dataset.detail),'_blank');
    };
  });
  box.querySelectorAll('[data-fb]').forEach(function(b){
    b.onclick=function(){ saveFeedback(b.dataset.name, b.dataset.fb); };
  });
  box.querySelectorAll('[data-export]').forEach(function(b){
    b.onclick=function(){
      const out={generated_at:new Date().toISOString(), fair_id:P.fair_id,
                 weights:P.weights, sort_mode:sortMode,
                 rows:currentRows.map(function(r){
                   return {rank:r.rank,name:r.name,booth:r.booth,state:r.state,
                           trust:r.trust,score:r.score,effective_weight:r.effective_weight,
                           matched_jobs:r.matched_jobs,questions:r.questions,
                           feedback:feedback[r.name]||null};
                 })};
      try{
        const blob=new Blob([JSON.stringify(out,null,1)],{type:'application/json'});
        const a=document.createElement('a');
        a.href=URL.createObjectURL(blob); a.download='双选会现场队列.json'; a.click();
      }catch(err){ console.log('导出数据（当前环境不支持下载）',out); }
    };
  });
  box.querySelectorAll('[data-next]').forEach(function(b){
    b.onclick=function(){
      const t=rows.findIndex(function(r){return r.name===b.dataset.next;});
      const el=document.getElementById('tri-'+t);
      if(el){ el.scrollIntoView({behavior:'smooth',block:'start'}); el.style.outline='2px solid #2563eb'; }
      const cur=b.closest('.row'); if(cur) cur.style.opacity='.45';
      visitedSet[b.dataset.name||'']=1;
      visited++; remainMin=Math.max(0,remainMin-1); render();
    };
  });
  box.querySelectorAll('[data-done]').forEach(function(b){
    b.onclick=function(){
      const cur=b.closest('.row'); if(cur) cur.style.opacity='.45';
      visitedSet[b.dataset.name||'']=1;
      visited++; remainMin=Math.max(0,remainMin-8); render();
    };
  });
  injected=true;
}

function schedule(){ if(suppress) return; clearTimeout(timer); timer=setTimeout(render,700); }

/* #mres 出现后接管内容；同时持续监听采集端画像变化 */
let wait;
wait=setInterval(function(){
  const box=document.getElementById('mres');
  if(!box) return;
  clearInterval(wait);
  new MutationObserver(schedule).observe(box,{childList:true,subtree:true});
  setTimeout(function(){ if(!injected && !box.innerHTML.trim()) render(); },2500);
  refreshFromServer();          // v6：服务模式下先取库里最新画像重建过的报告
  loadFeedback();               // v7：取回现场核实结果（离线读 localStorage）
  lastSig=JSON.stringify(getProfile());
  setInterval(function(){
    const sig=JSON.stringify(getProfile());
    if(sig!==lastSig){ lastSig=sig; render(); }
  },1200);
},200);
})();
</script>
</body>
</html>
