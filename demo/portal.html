<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>双选会助手 · 统一入口</title>
<style>
  :root{--bg:#f5f7fb;--card:#fff;--line:#e2e7f0;--text:#1f2a3d;--muted:#7a869c;--blue:#2563eb}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;display:flex;flex-direction:column}
  header{background:#fff;border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;flex:none}
  .brand{font-size:16px;font-weight:700;white-space:nowrap}
  .brand small{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
  nav{display:flex;gap:6px;flex-wrap:wrap}
  nav button{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:6px;padding:6px 14px;font-size:13px;cursor:pointer;white-space:nowrap}
  nav button:hover{color:var(--blue);background:#f0f5ff}
  nav button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  .status{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
  .hint{background:#fffbeb;border-bottom:1px solid #f3e2b8;color:#8a6d1f;font-size:12px;padding:5px 18px;flex:none}
  main{flex:1;min-height:0;padding:8px 10px 0;display:flex}
  iframe{flex:1;width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;min-height:0}
  footer{flex:none;padding:4px 18px 8px;font-size:12px;color:var(--muted)}
  footer a{color:var(--blue);text-decoration:none}
</style>
</head>
<body>
<header>
  <div class="brand">双选会助手 <small>一个入口 · 全流程</small></div>
  <nav>
    <button data-tab="flow" class="on">① 填写问卷（含教培）</button>
    <button data-tab="report">② 排行报告</button>
    <button data-tab="tests">③ 测试记录</button>
    <button data-tab="users">④ 测试数据</button>
  </nav>
  <span class="status" id="status">读取状态中…</span>
</header>
<div class="hint" id="hint">从「填写问卷」开始：简历上传 → 偏好 → 岗位推荐 → 排序追问 → 硬约束 → <b>是否接受教培</b> → 生成画像并出报告。</div>
<main><iframe id="frame" src="/fair.html" title="双选会助手"></iframe></main>
<footer>当前服务 <b id="host"></b> ｜ 各页也可单独打开：
  <a href="/fair.html" target="_blank">问卷</a> ·
  <a href="/fair.html?report=1" target="_blank">报告</a> ·
  <a href="/tests.html" target="_blank">测试记录</a> ·
  <a href="/test_users.html" target="_blank">测试数据</a>
</footer>

<script>
(function(){
  var TABS = {
    flow:   {url:'/fair.html',             hint:'从「填写问卷」开始：简历上传 → 偏好 → 岗位推荐 → 排序追问 → 硬约束 → <b>是否接受教培</b> → 生成画像并出报告。'},
    report: {url:'/fair.html?report=1',    hint:'报告页按排序分从高到低展示全部企业；底部「实验记录」可保存本次结果，也可跳到独立测试记录页。'},
    tests:  {url:'/tests.html',            hint:'测试记录管理：查看每次跑的输入与输出、逐条删除、批量清理测试脏数据，只留真人跑的。'},
    users:  {url:'/test_users.html',       hint:'测试数据：三套随机画像（药学 / 工程造价 / 能源与动力工程）。可直接「用这套画像打开排行」，也可「提交入库」跑完整链路（约 1–3 分钟，会调大模型）。'}
  };
  var frame=document.getElementById('frame');
  var hint=document.getElementById('hint');
  document.getElementById('host').textContent=location.host;
  function go(tab){
    var t=TABS[tab]; if(!t) return;
    document.querySelectorAll('nav button').forEach(function(b){
      b.classList.toggle('on', b.dataset.tab===tab);
    });
    // 带时间戳强制重载，避免切回来时看到旧画像 / 旧测试记录
    frame.src=t.url+(t.url.indexOf('?')>=0?'&':'?')+'_t='+Date.now();
    hint.innerHTML=t.hint;
    location.hash=tab;
  }
  document.querySelectorAll('nav button').forEach(function(b){
    b.onclick=function(){ go(b.dataset.tab); };
  });
  var init=location.hash.replace('#','');
  if(TABS[init]) go(init); else go('flow');

  // 顶部状态：生效画像 + 榜单家数 + 测试记录条数
  function status(){
    var s=document.getElementById('status');
    Promise.all([
      fetch('/api/fair/payload').then(function(r){return r.json();}),
      fetch('/api/fair/test-list?limit=100').then(function(r){return r.json();})
    ]).then(function(a){
      var p=a[0]||{}, items=(a[1]&&a[1].items)||[];
      s.textContent='生效画像 '+(p.active_fair_id||'—')+' ｜ 榜单 '+((p.rows||[]).length)+' 家 ｜ 测试记录 '+items.length+' 条';
    }).catch(function(){ s.textContent='服务未就绪'; });
  }
  status();
  setInterval(status, 30000);
})();
</script>
</body>
</html>
